<!DOCTYPE html>
<html lang="uz">
<head>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#111827"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nur Islam Metal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F1FB;--side:#FFFFFF;--card:#FFFFFF;--ink:#1E1B2E;--muted:#5F5B73;--line:#E7E4F0;--soft:#F7F6FC;
--a1:#6C5CE7;--a1ink:#FFFFFF;--a2:#D97706;--act:#E9E4FF;--actink:#4B3BB5;--pos:#0F7A55;--neg:#C0263F;
--k1:#FFF1E3;--k2:#EEEAFE;--k3:#E3F6F1;--k4:#FDE8EE;--k5:#E8F1FD;--k6:#F4F1E8;--r:16px;--th:#F1EFF9}
body[data-theme=dark]{--bg:#0E1116;--side:#151A21;--card:#171C24;--ink:#EEF2F6;--muted:#A1ABB8;--line:#262E39;--soft:#1B212A;
--a1:#2DD4BF;--a1ink:#0E1116;--a2:#FBBF24;--act:#1F2731;--actink:#5EEAD4;--pos:#34D399;--neg:#FB7185;
--k1:#171C24;--k2:#171C24;--k3:#171C24;--k4:#171C24;--k5:#171C24;--k6:#171C24;--th:#1B212A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45}
h1,h2,h3{font-family:Inter,sans-serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
nav.side{flex:none;width:246px;background:var(--side);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 16px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--a1);color:var(--a1ink);display:flex;align-items:center;justify-content:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:14px;flex:none}
.brand b{display:block;font-family:Inter,system-ui,sans-serif;font-size:16px}.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;border:0;background:transparent;color:var(--muted);cursor:pointer;text-align:left;font-weight:500;width:100%}
.nav:hover{background:var(--soft)}.nav.on{background:var(--act);color:var(--actink);font-weight:600}
.nav svg{flex:none}.nav .chev{margin-left:auto;transition:transform .15s}.grp.open>.nav .chev{transform:rotate(90deg)}
.grp.cur>.nav{color:var(--ink);font-weight:600}
.navsub{display:none;flex-direction:column;gap:1px;padding:2px 0 6px 31px}.grp.open .navsub{display:flex}
.navsub .nav{padding:7px 12px;font-size:13.5px}
.side .foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.ava{width:34px;height:34px;border-radius:99px;background:var(--a2);color:#1a1a1a;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
main{flex:1;min-width:0;padding:20px 26px 60px;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
header.top h1{font-size:23px}
.crumb{font-size:12px;color:var(--muted)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inp,select.inp{height:38px;padding:0 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);min-width:0}
textarea.inp{height:auto;padding:8px 12px}
.inp:focus{outline:2px solid var(--a1);outline-offset:-1px;border-color:transparent}
.money,.qty{text-align:right;font-variant-numeric:tabular-nums}
.btn{height:38px;padding:0 15px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:hover{border-color:var(--a1)}
.btn.pri{background:var(--a1);color:var(--a1ink);border-color:var(--a1);font-weight:600}
.btn.acc{background:var(--a2);color:#1a1a1a;border-color:var(--a2);font-weight:600}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn.danger{color:var(--neg)}.btn.armed{background:var(--neg);color:#fff;border-color:var(--neg)}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.card h2{font-size:16px;margin-bottom:12px}
.card.flush{padding:0;overflow:hidden}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.kpi{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi .l{font-size:13px;color:var(--muted)}.kpi .v{font-family:Inter,system-ui,sans-serif;font-size:22px;font-weight:700;white-space:nowrap}
.kpi .d{font-size:12px;color:var(--muted)}
.row2{display:flex;flex-wrap:wrap;gap:16px}.row2>*{flex:1 1 320px;min-width:0}
.grid-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
label.f .inp{color:var(--ink);font-size:14px}
label.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
.jt thead th{background:var(--th);position:sticky;top:0}
.jt tfoot td{background:var(--th);font-weight:700;border-bottom:0}
.jt td{white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%;border-radius:4px}
.lead td{vertical-align:middle}.lead td.rk{width:28px;font-weight:700;color:var(--muted);font-size:15px}.lead tr.me td{background:var(--soft)}.kpi.click{cursor:pointer}.kpi.click:hover{border-color:#C9CED6}
.perm input[type=checkbox]{width:18px;height:18px;accent-color:var(--a1);cursor:pointer}.perm td:first-child{white-space:normal;min-width:240px}
.pill.boss{background:#FFF4D6;color:#8A5A00;border-color:transparent;font-weight:600}body[data-theme=dark] .pill.boss{background:#3A2E10;color:#F5C451}
.ctip{position:fixed;display:none;z-index:99;background:var(--ink);color:var(--card);padding:5px 9px;border-radius:8px;font-size:12px;pointer-events:none;white-space:nowrap}
.jt th.cur{color:var(--actink)}
.posg .line{grid-template-columns:minmax(150px,2.4fr) 72px 84px 110px minmax(92px,1fr) 30px;gap:6px}
.posg .grid-f{grid-template-columns:repeat(2,minmax(0,1fr))}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
tr.sel td{background:var(--act)!important}
tr.void td{opacity:.45;text-decoration:line-through}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
tr.sub td{font-weight:600;background:var(--soft)}
td.ind{padding-left:24px;color:var(--muted)}
.tbl{overflow-x:auto}
.docno{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:24px;padding:0 7px;border-radius:7px;background:var(--act);color:var(--actink);font-weight:600;font-size:12.5px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--muted)}.sm{font-size:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.toolbar .inp{height:36px}
.toolbar .grow{flex:1 1 200px}
.pager{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.pager .pg{display:flex;gap:4px}
.pager button{min-width:32px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.pager button.on{background:var(--a1);color:var(--a1ink);border-color:var(--a1)}
.lines{display:flex;flex-direction:column;gap:10px}
.line{display:grid;grid-template-columns:minmax(200px,3fr) 90px minmax(90px,1fr) minmax(110px,1.3fr) minmax(110px,1.2fr) 36px;gap:8px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}
.line .info{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-2px}
.line .sum{height:38px;display:flex;align-items:center;justify-content:flex-end;font-weight:600}
@media(max-width:700px){.line{grid-template-columns:1fr 1fr}.line .lp{grid-column:1/-1}}
.x{width:36px;height:38px;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;border-radius:8px}.x:hover{color:var(--neg);background:var(--k4)}
.totals{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.totrow{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.big{font-family:Inter,system-ui,sans-serif;font-size:22px;font-weight:700}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--k3);color:var(--pos);border-color:transparent}
.pill.warn{background:var(--k4);color:var(--neg);border-color:transparent}
.pill.info{background:var(--k5);border-color:transparent}
.empty{color:var(--muted);padding:16px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:500;z-index:80;max-width:90vw;display:none}
#toast.err{background:var(--neg);color:#fff}
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:70;padding:20px}
#login .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
#login .err{color:var(--neg);font-size:13px;min-height:18px}
.hidden{display:none!important}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#view{display:flex;flex-direction:column;gap:16px}
/* drawer */
#scrim{position:fixed;inset:0;background:rgba(20,16,40,.32);z-index:50;display:none}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100vw);background:var(--card);z-index:60;box-shadow:-10px 0 40px rgba(20,16,40,.18);display:none;flex-direction:column}
body.dr #scrim{display:block}body.dr #drawer{display:flex}
.dh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.dh h2{font-size:18px}
#drawer a{color:var(--actink);font-weight:600}
.dacts{display:flex;flex-wrap:wrap;gap:6px;padding:10px 18px;border-bottom:1px solid var(--line)}
.db{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.db>*{flex-shrink:0}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;background:var(--soft);border-radius:12px;padding:12px 14px}
.meta div{display:flex;flex-direction:column;gap:2px}.meta span{font-size:12px;color:var(--muted)}
/* POS */
.posg{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr);gap:16px;align-items:start}
@media(max-width:1100px){.posg{grid-template-columns:1fr}}
.pick{position:sticky;top:12px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 24px)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px}
.chip.on{background:var(--a1);color:var(--a1ink);border-color:var(--a1)}
.plist{overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px}
.pt{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;text-align:left;width:100%}
.pt:hover{border-color:var(--a1);background:var(--soft)}
.pt b{display:block;font-weight:600}.pt .r{text-align:right;white-space:nowrap}
#printArea{display:none}
@media print{
 body.printing>*{display:none!important}
 body.printing #printArea{display:block!important}
 body.printing{background:#fff;color:#000}
}
.rc{width:72mm;font:12px/1.4 'Courier New',Courier,monospace;color:#000;padding:1mm}
.rc .c{text-align:center}.rc .r{display:flex;justify-content:space-between;gap:6px}.rc .hr{border-top:1px dashed #000;margin:4px 0}.rc b{font-weight:700}.rc .big{font-size:15px;font-family:inherit}
#mbar{display:none}
.pk-close{display:none}
.pv{font-family:Inter,Arial,sans-serif;color:#000;font-size:12px;padding:8mm}
.pv h2{font-size:18px;margin:0 0 4px}
.pv .ph{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:10px}
.pv table{border-collapse:collapse;width:100%;margin:8px 0}
.pv th,.pv td{border:1px solid #444;padding:5px 7px;color:#000;font-size:12px;text-align:left}
.pv td.n,.pv th.n{text-align:right}
.pv .sig{display:flex;justify-content:space-between;margin-top:36px;gap:30px}
.pv .sig div{flex:1;border-top:1px solid #000;padding-top:4px;font-size:11px}
.menu-btn{display:none}
.pkbtn{display:none!important}
@media(max-width:900px){
 .cvg{grid-template-columns:1fr!important}
 .posg .line{grid-template-columns:1fr 1fr}.posg .line .lp{grid-column:1/-1}
 .posg .pick{display:none}
 body.pkopen .posg .pick{display:flex;position:fixed;inset:0;z-index:66;border-radius:0;max-height:none;padding:14px}
 body.pkopen .pk-close{display:flex}
 #mbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:10px 12px;gap:10px;align-items:center;box-shadow:0 -6px 20px rgba(20,16,40,.08)}
 body.saleview #mbar{display:flex}
 body.saleview main{padding-bottom:96px}
 .pkbtn{display:flex!important}
 nav.side{position:fixed;left:0;top:0;bottom:0;z-index:65;transform:translateX(-105%);transition:transform .2s;box-shadow:10px 0 40px rgba(20,16,40,.2)}
 body.mnav nav.side{transform:none}body.mnav #scrim{display:block}
 .menu-btn{display:flex}
 main{padding:14px 12px 60px}header.top h1{font-size:20px}
}
#tabbar{display:none}
@media(max-width:900px){
 #tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 #tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font-size:11px;padding:4px 0;cursor:pointer}
 #tabbar button.on{color:var(--ink);font-weight:600}
 body.saleview #tabbar{display:none}
 main{padding-bottom:90px}
 #themeBtn{display:none}
 header.top{gap:8px}header.top .ctrl{width:100%}
 .kpis{grid-template-columns:1fr 1fr!important}.kpi{border-bottom:1px solid var(--line)}.kpi .v{font-size:21px!important}
 .card.flush .toolbar{flex-wrap:wrap}
}
@media(max-width:700px){
 .jt.cards thead{display:none}
 .jt.cards,.jt.cards tbody,.jt.cards tfoot{display:block}
 .jt.cards tr{display:grid;grid-template-columns:auto 1fr auto;column-gap:10px;row-gap:3px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
 .jt.cards td{border:0;padding:0;white-space:normal;background:none!important}
 .jt.cards td.c-x{display:none}
 .jt.cards td:first-child{grid-column:1;grid-row:1}
 .jt.cards td.c-date{grid-column:2;grid-row:1;color:var(--muted);font-size:12.5px}
 .jt.cards td.c-money{grid-column:3;grid-row:1/3;text-align:right;font-weight:600;font-size:15px}
 .jt.cards td.c-main{grid-column:1/3;grid-row:2;font-size:15px}
 .jt.cards td.c-tag{grid-column:1/-1;text-align:left}
 .jt.cards td.c-act{grid-column:3;grid-row:3;text-align:right}
 .jt.cards td.c-tag:has(> span.mut:only-child){display:none}
 .jt.cards td.c-tag:empty{display:none}
 .jt.cards tr:has(td.c-main:first-child) td.c-date{grid-column:1/3;grid-row:1}
 .jt.cards tr:has(td.c-main:first-child) td.c-main{grid-row:2}
 .jt.cards tfoot tr{background:var(--th);font-weight:700}
 .jt.cards td.empty{grid-column:1/-1}
}
/* ---- Минимал дизайн ---- */
:root{--bg:#F7F8FA;--side:#FFFFFF;--card:#FFFFFF;--ink:#101828;--muted:#667085;--line:#EAECF0;--soft:#F4F5F7;--a1:#111827;--a1ink:#FFFFFF;--a2:#2F6FED;--act:#F2F4F7;--actink:#101828;--pos:#0E8A5F;--neg:#D92D20;--k1:#fff;--k2:#fff;--k3:#fff;--k4:#fff;--k5:#fff;--k6:#fff;--r:12px;--th:#FAFAFB}
body[data-theme=dark]{--bg:#0C0E12;--side:#111418;--card:#15181D;--ink:#F2F4F7;--muted:#98A2B3;--line:#252A31;--soft:#1B1F25;--a1:#F2F4F7;--a1ink:#0C0E12;--a2:#5B8CFF;--act:#1F242B;--actink:#FFFFFF;--pos:#3CCB8F;--neg:#F97066;--k1:#15181D;--k2:#15181D;--k3:#15181D;--k4:#15181D;--k5:#15181D;--k6:#15181D;--th:#181B20}
body{font-family:Inter,system-ui,sans-serif;font-feature-settings:'cv11','ss01'}
h1,h2,h3,.kpi .v,.brand b,.logo{font-family:Inter,sans-serif;letter-spacing:-.02em}
header.top h1{font-size:28px;font-weight:650}
.card h2{font-size:15px;font-weight:600}
nav.side{border-right:1px solid var(--line);padding-top:22px}
nav.side .logo{border-radius:9px;background:var(--a1);color:var(--a1ink);font-size:13px}
nav.side .nav{color:var(--muted);border-radius:8px}
nav.side .nav:hover{background:var(--soft);color:var(--ink)}
nav.side .nav.on{background:var(--act);color:var(--ink);font-weight:600}
nav.side .grp.cur>.nav{color:var(--ink)}
.kpis{gap:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kpi{background:var(--card)!important;border:0;border-right:1px solid var(--line);border-radius:0;padding:18px 22px}
.kpi:last-child{border-right:0}
.kpi .l{font-size:13px;font-weight:500}
.kpi .v{font-size:28px;font-weight:600}
.card{border-color:var(--line);box-shadow:none}
.btn{border-radius:9px;font-weight:500}
.btn.pri{background:var(--a1);border-color:var(--a1);color:var(--a1ink)}
.btn.acc{background:var(--a2);border-color:var(--a2);color:#fff}
.btn:hover{border-color:#C9CED6}
.inp,select.inp{border-radius:9px}
.inp:focus{outline:2px solid var(--a2)}
.jt thead th{background:var(--card);color:var(--muted);font-weight:500;border-bottom:1px solid var(--line)}
.jt tfoot td{background:var(--th)}
tr.tot td{border-top:1.5px solid var(--ink)}
.pill{border-radius:6px}
.chip.on{background:var(--a1);color:var(--a1ink);border-color:var(--a1)}
.pill.ok{background:#E8F6EF}.pill.warn{background:#FEEEEC}.pill.info{background:#EBF1FE;color:#2450B8}
body[data-theme=dark] .pill.ok{background:#12291F}body[data-theme=dark] .pill.warn{background:#2E1714}body[data-theme=dark] .pill.info{background:#16213A;color:#9DB8FF}
body{font-optical-sizing:auto}
</style>
</head>
<body>
<div id="login">

  if(act==='ret'){ btn.disabled=true; api('returnedFor', S.token, x.id).then(function(by){ S.form={kind:'ret', sale:x, done:by, qty:{}, date:today(), refund:'', method:'naqd', note:'', auto:true}; go('retForm', true); }).catch(function(e){ btn.disabled=false; toast(errText(e),true); }); return; }

  if(kind==='sale'){ f.client=''; f.seller=S.me.name; f.naqd=''; f.plastik=''; f.click=''; f.perech=''; f.disc=''; f.dlv={on:false, mode:'client', addr:'', phone:'', date:today(), time:'', driver:'', dphone:'', car:'', fee:'', cost:''}; }
  if(kind==='purch'){ f.supplier=''; f.cur='UZS'; f.rate=S.usd||''; }
  if(kind==='transf'){ f.to = f.branch==='f1'?'f2':'f1'; }
  return f;
}
function formFromSale(x){
  var f=newForm('sale'); f.editId=x.id; f.editNo=docNo(x); f.date=x.date; f.branch=x.branch; f.client=x.clientName||''; f.seller=x.seller; f.note=x.note||''; f.disc=x.disc||''; if(x.dlv){ f.dlv=JSON.parse(JSON.stringify(x.dlv)); f.dlv.on=true; } if(x.otk>0){ f.otkOn=true; f.agent=x.agent||''; }
  ['naqd','plastik','click','perech'].forEach(function(k){ f[k]=x[k]||''; });
  f.lines=x.items.map(function(it){ return {code:it.code, unit:it.unit, qty:String(it.qty), price:it.price, real:it.real||''}; });
  if(!f.lines.length) f.lines=[{code:'',unit:'',qty:'',price:''}];
  return f;
}
function lineHtml(f,i){
  var ln=f.lines[i], p=S.pmap[ln.code], showPrice = f.kind!=='transf';
  var units = p ? unitsOf(p) : [];
  var h = '<div class="line" data-i="'+i+'">';
  h += '<input class="inp lp" list="plist" placeholder="Код ёки товар номи" value="'+esc(p ? p.code+' — '+p.name : ln.raw||'')+'" data-f="prod" aria-label="Товар">';
  h += '<select class="inp" data-f="unit" aria-label="Ўлчов">'+(units.length?units.map(function(u){ return '<option'+(u===ln.unit?' selected':'')+'>'+esc(u)+'</option>'; }).join(''):'<option>—</option>')+'</select>';
  h += '<input class="inp qty" inputmode="decimal" placeholder="Миқдор" value="'+esc(ln.qty)+'" data-f="qty" aria-label="Миқдор">';
  var usd=f.kind==='purch' && f.cur==='USD';
  if(showPrice) h += '<input class="inp money" inputmode="decimal" placeholder="'+(f.kind==='sale'?'Сотув нархи':(usd?'Нарх ($)':'Таннарх нархи'))+'" value="'+(ln.price!==''?(usd?esc(ln.price):fmt(ln.price)):'')+'" data-f="price" aria-label="Нарх">';
  else h += '<div></div>';
  h += '<div class="sum" data-sum>'+(showPrice?lineSumText(f,ln):'')+'</div>';
  h += '<button type="button" class="x" data-del="'+i+'" aria-label="Қаторни ўчириш">×</button>';
  h += '<div class="info" data-info>'+lineInfo(f,i)+'</div>';
  if(f.kind==='purch' && p && p.unit2 && ln.unit===p.unit2 && Number(p.k2)>0) h += '<div class="info" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:0"><span>Ҳақиқий '+esc(p.unit)+' (тортилган / саналган):</span><input class="inp qty" data-f="qbf" inputmode="decimal" style="width:130px;height:32px" placeholder="'+fq(pq(ln.qty)*Number(p.k2))+'" value="'+esc(ln.qbf||'')+'"><span class="mut">'+(pq(ln.qbf)>0&&pq(ln.qty)>0?'бу партияда 1 '+esc(p.unit2)+' = <b>'+fq(Math.round(pq(ln.qbf)/pq(ln.qty)*10)/10)+'</b> '+esc(p.unit)+' (стандарт '+fq(p.k2)+')':'бўш бўлса стандарт: 1 '+esc(p.unit2)+' = '+fq(p.k2)+' '+esc(p.unit))+'</span></div>';
  if(f.kind==='sale' && f.otkOn) h += '<div class="info" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:0"><span>Ҳақиқий нарх:</span><input class="inp money" data-f="real" inputmode="numeric" style="width:150px;height:32px" placeholder="'+(ln.price!==''?fmt(ln.price):'')+'" value="'+(ln.real?fmt(ln.real):'')+'"><span data-otk>'+lineOtk(ln)+'</span></div>';
  h += '</div>';
  return h;
}
function lineOtk(ln){ var r=pm(ln.real), p=pm(ln.price); if(!(r>0)) return '<span class="mut">бўш бўлса — откат йўқ</span>'; if(r>p) return '<span class="neg">чекдаги нархдан катта!</span>'; return 'Откат: <b>'+fmt(pq(ln.qty)*(p-r))+'</b>'; }
function formOtk(f){ var t=0; [f].concat(f.multi&&f.b2?[f.b2]:[]).forEach(function(ff){ if(!f.otkOn) return; ff.lines.forEach(function(l){ var r=pm(l.real), p=pm(l.price); if(r>0&&r<=p) t+=Math.round(pq(l.qty)*(p-r)); }); }); return t; }
function priceOf(f,ln){ return (f.kind==='purch' && f.cur==='USD') ? pq(ln.price) : pm(ln.price); }
function lineSumText(f,ln){ var v=pq(ln.qty)*priceOf(f,ln); return (f.kind==='purch' && f.cur==='USD') ? fu(v)+' $' : fmt(v); }
function lineInfo(f,i){
  var ln=f.lines[i], p=S.pmap[ln.code]; if(!p) return ln.raw ? '<span class="neg">Товар топилмади — кодни ёки номни рўйхатдан танланг</span>' : '';
  var br=f.branch, st=stockOf(p.code, br), fac=factor(p, ln.unit);
  var t='Қолдиқ ('+BR[br]+'): '+qtyText(p, st.qty);
  var pcs=(S.pieces||[]).filter(function(x){ return x.code===p.code && x.branch===br; }); if(pcs.length && f.kind==='sale') t+=' · <span class="pill warn" title="Аввал бўлакни сотинг">бўлаклар: '+pcs.map(function(x){ return fq(x.len); }).join(', ')+' '+esc(p.unit)+'</span>';
  var qb=pq(ln.qty)*fac;
  if((f.kind==='sale'||f.kind==='transf') && qb>0 && qb>st.qty+1e-9) t+=' <span class="pill warn">етмайди</span>';
  if(perm('see_cost') && st.avg!=null && f.kind!=='open'){
    var cu=st.avg*fac; t+=' · Таннарх: '+fmt(cu)+' / '+esc(ln.unit||p.unit);
    if(f.kind==='sale' && pq(ln.qty)>0 && pm(ln.price)>0){ var pr=pq(ln.qty)*(pm(ln.real)>0&&f.otkOn?pm(ln.real):pm(ln.price)) - qb*st.avg; t+=' · Фойда: <b class="'+cls(pr)+'">'+fmt(pr)+'</b>'; }
  }
  return t;
}
function formTotal(f){ var t=0; f.lines.forEach(function(l){ t += pq(l.qty)*priceOf(f,l); }); return (f.kind==='purch' && f.cur==='USD') ? Math.round(t*100)/100 : Math.round(t); }
function bindLines(f, onChange){
  var box = $(f.box||'lines');
  box.oninput = function(e){
    var el=e.target, row=el.closest('.line'); if(!row) return; var i=+row.dataset.i, ln=f.lines[i], k=el.dataset.f;
    if(k==='qty'){ ln.qty = el.value; }
    if(k==='qbf'){ ln.qbf=el.value; return; }
    if(k==='real'){ var v2=pm(el.value); ln.real=el.value.trim()===''?'':v2; el.value=el.value.trim()===''?'':fmt(v2); var oo=row.querySelector('[data-otk]'); if(oo) oo.innerHTML=lineOtk(ln); row.querySelector('[data-info]').innerHTML=lineInfo(f,i); onChange(); return; }
    if(k==='price'){
      if(f.kind==='purch' && f.cur==='USD'){ ln.price = el.value.trim()===''?'':el.value.replace(',','.'); }
      else { var v=pm(el.value); ln.price = el.value.trim()===''?'':v; var pos=el.value.length-el.selectionStart; el.value = el.value.trim()===''?'':fmt(v); try{ var np=Math.max(0,el.value.length-pos); el.setSelectionRange(np,np);}catch(_){} }
    }
    if(k==='prod'){ ln.raw = el.value; var p=findProduct(el.value); if(p && p.code!==ln.code){ setProd(f,i,p); row.outerHTML = lineHtml(f,i); var nr=box.querySelector('.line[data-i="'+i+'"] [data-f="qty"]'); if(nr) nr.focus(); onChange(); return; } if(!p && ln.code){ ln.code=''; } }
    var s=row.querySelector('[data-sum]'); if(s && f.kind!=='transf') s.textContent = lineSumText(f,ln);
    row.querySelector('[data-info]').innerHTML = lineInfo(f,i);
    onChange();
  };
  box.onchange = function(e){
    var el=e.target, row=el.closest('.line'); if(!row) return; var i=+row.dataset.i, ln=f.lines[i];
    if(el.dataset.f==='unit'){ ln.unit=el.value; var p=S.pmap[ln.code]; if(p && f.kind==='sale'){ ln.price = (ln.unit===p.unit2 ? Number(p.price2)||'' : Number(p.price)||''); } row.outerHTML=lineHtml(f,i); onChange(); }
    if(el.dataset.f==='prod'){ var p2=findProduct(el.value); row.querySelector('[data-info]').innerHTML = lineInfo(f,i); if(!p2) row.querySelector('[data-info]').innerHTML='<span class="neg">Товар топилмади — рўйхатдан танланг</span>'; }
  };
  box.onclick = function(e){
    var d=e.target.closest('[data-del]'); if(!d) return; f.lines.splice(+d.dataset.del,1); if(!f.lines.length) f.lines.push({code:'',unit:'',qty:'',price:''}); drawLines(f); onChange();
  };
}
function setProd(f,i,p){
  var ln=f.lines[i]; ln.code=p.code; ln.raw='';
  if(f.kind==='purch' || f.kind==='open') ln.unit = p.unit2 || p.unit; else ln.unit = p.unit;
  if(f.kind==='sale') ln.price = (ln.unit===p.unit2 ? Number(p.price2)||'' : Number(p.price)||'');
  if(f.kind==='open' && canCount()){ var st=stockOf(p.code,f.branch); if(st.avg) ln.price=Math.round(st.avg*factor(p,ln.unit)); if(st.qty) ln.qty=String(Math.round(st.qty/factor(p,ln.unit)*1000)/1000); }
}
function drawLines(f){ $(f.box||'lines').innerHTML = f.lines.map(function(_,i){ return lineHtml(f,i); }).join(''); }
function linesPayload(f){
  var out=[], bad=null;
  f.lines.forEach(function(l){ if(!l.code && !(l.raw||'').trim() && !l.qty) return; if(!l.code){ bad='Товар топилмади: '+(l.raw||''); return; } var o={code:l.code, unit:l.unit, qty:pq(l.qty), price:priceOf(f,l)}; if(f.kind==='sale'&&f.otkOn&&pm(l.real)>0) o.real=pm(l.real); if(f.kind==='purch'&&pq(l.qbf)>0) o.qbFact=pq(l.qbf); out.push(o); });
  if(bad) throw new Error(bad); if(!out.length) throw new Error('Камида битта товар қўшинг'); return out;
}

function repSum(){
  var R=S.rep.branches, bs = S.branch==='all'?['f1','f2']:[S.branch], o={revenue:0,cogs:0,expTotal:0,stockValue:0,collected:0,qarz:0,days:{},exp:{}};
  bs.forEach(function(b){ var r=R[b]; ['revenue','cogs','expTotal','stockValue','collected','qarz'].forEach(function(k){ o[k]+=r[k]; });
    Object.keys(r.days).forEach(function(d){ var x=o.days[d]||(o.days[d]={rev:0,gross:0}); x.rev+=r.days[d].rev; x.gross+=r.days[d].gross; });
    Object.keys(r.exp).forEach(function(k){ o.exp[k]=(o.exp[k]||0)+r.exp[k]; }); });
  o.gross=o.revenue-o.cogs; o.net=o.gross-o.expTotal; return o;
}

function dayChart(days){
  var p=S.month.split('-'), n=new Date(+p[0], +p[1], 0).getDate(), W=900, H=220, pl=56, pb=24, pt=10, bw=(W-pl-10)/n;
  var max=0; for(var d=1; d<=n; d++){ var x=days[S.month+'-'+pad(d)]; if(x) max=Math.max(max,x.rev); }
  if(!max) return '<div class="empty">Бу ойда ҳали сотув йўқ.</div>';
  var y=function(v){ return pt+(1-Math.max(0,v)/max)*(H-pt-pb); }, s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Кунлик сотув графиги">';
  for(var g=0; g<=3; g++){ var gv=max*g/3; s+='<line x1="'+pl+'" x2="'+(W-10)+'" y1="'+y(gv)+'" y2="'+y(gv)+'" stroke="var(--line)"></line><text x="'+(pl-6)+'" y="'+(y(gv)+4)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+short(gv)+'</text>'; }
  for(var d2=1; d2<=n; d2++){ var k=S.month+'-'+pad(d2), v=days[k], bx=pl+(d2-1)*bw;
    if(v && v.rev>0){ s+='<rect x="'+(bx+bw*.12)+'" y="'+y(v.rev)+'" width="'+(bw*.38)+'" height="'+(H-pb-y(v.rev))+'" rx="2" fill="var(--a1)"><title>'+dLabel(k)+': тушум '+fmt(v.rev)+'</title></rect>';
      var gp=Math.max(0,v.gross); s+='<rect x="'+(bx+bw*.52)+'" y="'+y(gp)+'" width="'+(bw*.38)+'" height="'+(H-pb-y(gp))+'" rx="2" fill="var(--a2)"><title>'+dLabel(k)+': ялпи фойда '+fmt(v.gross)+'</title></rect>'; }
    if(d2===1||d2%5===0) s+='<text x="'+(bx+bw/2)+'" y="'+(H-6)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+d2+'</text>'; }
  return s+'</svg>';
}
function short(v){ var a=Math.abs(v); if(a>=1e9) return (v/1e9).toFixed(1)+' млрд'; if(a>=1e6) return (v/1e6).toFixed(0)+' млн'; if(a>=1e3) return Math.round(v/1e3)+' минг'; return Math.round(v); }

  topActs(monthPicker()+(adm?'<button class="btn" type="button" id="slSt">Ходимлар</button>':'')+(perm('salary_all')?'<button class="btn" type="button" id="slP">'+ib('print','Ведомость')+'</button><button class="btn" type="button" id="slX">'+ib('xls','Excel')+'</button>':''), function(){ bindMonth(vSalary); if($('slSt')) $('slSt').onclick=function(){ staffDrawer(); }; });
  loadingView();
  api('salary', S.token, S.month).then(function(r){
    S.sal=r; var L=r.list, t={acc:0,given:0,left:0};
    L.forEach(function(x){ t.acc+=x.accrued; t.given+=x.adv+x.paid; t.left+=x.left; });
    var h='';
    if(r.own){
      if(!L.length){ setView('<div class="card empty">'+mLabel(S.month)+' учун ойлик маълумоти йўқ.</div>'); return; }
      setView('<div class="card">'+salBody(L[0])+'</div>'); return;
    }
    h+='<section class="kpis"><div class="kpi" style="background:var(--k2)"><span class="l">Ҳисобланди — '+mLabel(S.month)+'</span><span class="v">'+fmt(t.acc)+'</span></div><div class="kpi" style="background:var(--k3)"><span class="l">Берилди (аванс + ойлик)</span><span class="v">'+fmt(t.given)+'</span></div><div class="kpi" style="background:var(--k4)"><span class="l">Беришимиз керак</span><span class="v '+(t.left>0?'neg':'')+'">'+fmt(t.left)+'</span></div></section>';
    h+='<div class="card flush"><div class="tbl"><table class="jt"><thead><tr><th>Ходим</th><th class="n">Тушган пул</th><th>План</th><th class="n">Ставка</th><th class="n">Фоиздан</th><th class="n">Оклад</th><th class="n">Бонус</th><th class="n">Штраф</th><th class="n">Ҳисобланди</th><th class="n">Берилди</th><th class="n">Қолди</th></tr></thead><tbody>';
    h+=L.length?L.map(function(x,i){ var pr=x.plan>0?Math.min(100,x.base/x.plan*100):0;
      return '<tr class="click" data-si="'+i+'"><td><b>'+esc(x.name)+'</b><div class="mut sm">'+esc(x.pos||'')+(x.pos?' · ':'')+(BR[x.branch]||'Иккала филиал')+'</div>'+(x.setup?'':'<span class="pill warn">шарти қўйилмаган</span>')+'</td><td class="n">'+(x.base?fmt(x.base):'<span class="mut">—</span>')+'</td><td style="min-width:130px">'+(x.plan>0?'<div class="bar"><i style="width:'+pr.toFixed(0)+'%;background:'+(pr>=100?'var(--pos)':'var(--a1)')+'"></i></div><div class="sm '+(pr>=100?'pos':'mut')+'">'+pr.toFixed(0)+'% · '+fM(x.plan)+'</div>':'<span class="mut sm">—</span>')+'</td><td class="n">'+(x.pct?String(x.pct).replace('.',',')+'%':'—')+'</td><td class="n">'+(x.pctAmt?fmt(x.pctAmt):'—')+'</td><td class="n">'+(x.oklad?fmt(x.oklad):'—')+'</td><td class="n pos">'+(x.planBonus+x.extra?fmt(x.planBonus+x.extra):'')+'</td><td class="n neg">'+(x.fine?fmt(x.fine):'')+'</td><td class="n"><b>'+fmt(x.accrued)+'</b></td><td class="n">'+(x.adv+x.paid?fmt(x.adv+x.paid):'—')+'</td><td class="n '+(x.left>0?'neg':(x.left<0?'pos':'mut'))+'"><b>'+fmt(x.left)+'</b></td></tr>'; }).join(''):'<tr><td colspan="11" class="empty">Ходим йўқ. «Ходимлар» тугмаси орқали қўшинг.</td></tr>';
    h+='</tbody>'+(L.length?'<tfoot><tr><td colspan="8">'+L.length+' та ходим</td><td class="n">'+fmt(t.acc)+'</td><td class="n">'+fmt(t.given)+'</td><td class="n">'+fmt(t.left)+'</td></tr></tfoot>':'')+'</table></div><div class="pager"><span>Тушган пул = шу ойда сотувчининг савдоларидан ҳақиқатда келган пул: нақд/пластик/Click/перечисление + шу ойда йиғилган қарзлар − қайтаришда берилган пул. Откат ва доставка улуши айрилади. Ойлик фойда-зарарга «Иш ҳақи» бўлиб ўзи тушади.</span></div></div>';
    setView(h);
    $('view').querySelectorAll('[data-si]').forEach(function(tr){ tr.onclick=function(){ salDrawer(L[+tr.dataset.si]); }; });
    if($('slX')) $('slX').onclick=function(){ xls('Ойлик '+S.month, ['Ходим','Лавозим','Тушган пул','План','Ставка %','Фоиздан','Оклад','План бонуси','Қўшимча бонус','Штраф','Ҳисобланди','Аванс','Ойлик берилди','Қолди'], L.map(function(x){ return [x.name,x.pos,x.base,x.plan,x.pct,x.pctAmt,x.oklad,x.planBonus,x.extra,x.fine,x.accrued,x.adv,x.paid,x.left]; })); };
    if($('slP')) $('slP').onclick=function(){ printDoc('Ойлик ведомости', {branch:'', date:mLabel(S.month)}, [{t:'№'},{t:'Ходим'},{t:'Ҳисобланди',n:1},{t:'Аванс',n:1},{t:'Штраф',n:1},{t:'Қўлга',n:1},{t:'Имзо'}], L.map(function(x,i){ return [i+1, x.name+(x.pos?' ('+x.pos+')':''), fmt(x.accrued+x.fine), x.adv?fmt(x.adv):'', x.fine?fmt(x.fine):'', fmt(x.accrued-x.adv), '']; }), [['Жами ҳисобланди',fmt(t.acc)],['Беришимиз керак',fmt(t.left)]]); };
  }).catch(failView);
}
function salBody(x){
  var b=x.b, h='<div class="meta"><div><span>Тушган пул</span><b style="font-size:18px">'+fmt(x.base)+'</b></div><div><span>Ҳисобланди</span><b style="font-size:18px">'+fmt(x.accrued)+'</b></div><div><span>Қолди</span><b style="font-size:18px" class="'+(x.left>0?'neg':'')+'">'+fmt(x.left)+'</b></div></div>';
  if(x.plan>0){ var pr=Math.min(100,x.base/x.plan*100); h+='<div style="margin:10px 0"><div class="bar" style="height:10px"><i style="width:'+pr.toFixed(0)+'%;background:'+(pr>=100?'var(--pos)':'var(--a1)')+'"></i></div><div class="sm" style="margin-top:4px">План: '+fmt(x.plan)+' · '+(x.base>=x.plan?'<b class="pos">бажарилди ✓</b>'+(x.bonusAmt?' — бонус '+fmt(x.bonusAmt):''):'яна <b>'+fmt(x.plan-x.base)+'</b> қолди'+(x.bonusAmt?' (бонус '+fmt(x.bonusAmt)+')':''))+'</div></div>'; }
  if(x.tiers.length){ var nx=x.tiers[x.tier+1];
    h+='<h3 style="margin:14px 0 6px">Фоиз шкаласи'+(x.mode==='step'?' <span class="mut sm">(ҳар поғона ўз фоизи билан)</span>':' <span class="mut sm">(етган поғона фоизи бутун суммага)</span>')+'</h3><table><tbody>'+x.tiers.map(function(t,i){ var hi=x.tiers[i+1]; return '<tr'+(i===x.tier?' style="background:var(--act);font-weight:700"':'')+'><td>'+(t[0]?fM(t[0])+(hi?' — '+fM(hi[0]):' дан юқори'):(hi?fM(hi[0])+' гача':'ҳар қандай сумма'))+'</td><td class="n">'+String(t[1]).replace('.',',')+'%</td></tr>'; }).join('')+'</tbody></table>';
    if(nx) h+='<div class="sm" style="margin-top:6px">Яна <b>'+fmt(nx[0]-x.base)+'</b> пул тушса — <b>'+String(nx[1]).replace('.',',')+'%</b> бўлади.</div>'; }
  h+='<h3 style="margin:14px 0 6px">Тушган пул қаердан</h3><table><tbody><tr><td>Сотувда тўланган</td><td class="n">'+fmt(b.atSale)+'</td></tr><tr><td>Шу ой сотувларининг қарзидан йиғилди</td><td class="n">'+fmt(b.collSame)+'</td></tr><tr><td>Олдинги ойлар қарзидан йиғилди</td><td class="n">'+fmt(b.collOld)+'</td></tr>'+(b.refund?'<tr><td>Қайтаришда мижозга берилди</td><td class="n neg">−'+fmt(b.refund)+'</td></tr>':'')+(b.otkCut?'<tr><td class="mut">Откат ва доставка улуши (ҳисобга кирмайди)</td><td class="n mut">'+fmt(b.otkCut)+'</td></tr>':'')+'<tr class="sub"><td><b>Жами</b></td><td class="n"><b>'+fmt(x.base)+'</b></td></tr></tbody></table>';
  h+='<h3 style="margin:14px 0 6px">Ойлик</h3><table><tbody>'+(x.oklad?'<tr><td>Оклад</td><td class="n">'+fmt(x.oklad)+'</td></tr>':'')+(x.pctAmt?'<tr><td>Фоиздан ('+String(x.pct).replace('.',',')+'%)</td><td class="n">'+fmt(x.pctAmt)+'</td></tr>':'')+(x.planBonus?'<tr><td>План бонуси</td><td class="n pos">+'+fmt(x.planBonus)+'</td></tr>':'')+(x.extra?'<tr><td>Қўшимча бонус</td><td class="n pos">+'+fmt(x.extra)+'</td></tr>':'')+(x.fine?'<tr><td>Штраф</td><td class="n neg">−'+fmt(x.fine)+'</td></tr>':'')+'<tr class="sub"><td><b>Ҳисобланди</b></td><td class="n"><b>'+fmt(x.accrued)+'</b></td></tr>'+(x.adv?'<tr><td>Аванс берилди</td><td class="n">−'+fmt(x.adv)+'</td></tr>':'')+(x.paid?'<tr><td>Ойлик берилди</td><td class="n">−'+fmt(x.paid)+'</td></tr>':'')+'<tr class="tot"><td>Қолди</td><td class="n">'+fmt(x.left)+'</td></tr></tbody></table>';
  if(x.ops.length) h+='<h3 style="margin:14px 0 6px">Ҳаракатлар</h3><table><tbody>'+x.ops.map(function(o){ return '<tr><td>'+dLabel(o.date)+' · '+SOPK[o.kind]+(o.method?' <span class="mut sm">'+(METHODS[o.method]||'')+'</span>':'')+(o.note?'<div class="mut sm">'+esc(o.note)+'</div>':'')+'</td><td class="n '+(o.kind==='fine'?'neg':(o.kind==='bonus'?'pos':''))+'">'+fmt(o.amount)+(perm('salary_set')?' <button class="btn sm danger" type="button" data-sv="'+esc(o.id)+'">Бекор</button>':'')+'</td></tr>'; }).join('')+'</tbody></table>';
  return h;
}
function salDrawer(x){
  var adm=perm('salary_set');
  var h=drawerHead(esc(x.name), mLabel(S.month)+(x.pos?' · '+esc(x.pos):''))+(perm('salary_pay')?'<div class="dacts"><button class="btn sm pri" type="button" data-so="pay">Ойлик бериш</button><button class="btn sm" type="button" data-so="adv">Аванс</button>'+(adm?'<button class="btn sm" type="button" data-so="bonus">Бонус</button><button class="btn sm" type="button" data-so="fine">Штраф</button><button class="btn sm" type="button" id="slPl">'+(x.setup?'Шартни ўзгартириш':'Шарт қўйиш')+'</button>':'')+'</div>':'')+'<div class="db">'+(x.setup?'':'<div class="pill warn">Бу ходимга ойлик шарти (оклад, фоиз, план) ҳали қўйилмаган.</div>')+salBody(x)+'</div>';
  openDrawer(h, function(d){ d.querySelector('[data-close]').onclick=closeDrawer;
    if($('slPl')) $('slPl').onclick=function(){ planDrawer(x); };
    d.querySelectorAll('[data-so]').forEach(function(b){ b.onclick=function(){ salOpDrawer(x, b.dataset.so); }; });
    d.querySelectorAll('[data-sv]').forEach(function(b){ b.onclick=function(){ if(!armed(b)) return; b.disabled=true; api('voidSalOp', S.token, b.dataset.sv).then(function(){ toast('Бекор қилинди'); invalidate(); closeDrawer(); vSalary(); }).catch(function(e){ b.disabled=false; toast(errText(e),true); }); }; });
  });
}
function salOpDrawer(x, kind){
  var def=kind==='pay'?Math.max(0,x.left):0, pays=kind==='pay'||kind==='adv';

    $('soS').onclick=function(){ var b=this; busy(b,true); api('addSalOp', S.token, {staff:x.name, month:S.month, kind:kind, amount:pm($('soA').value), date:$('soD').value, method:$('soM')?$('soM').value:'', branch:$('soB')?$('soB').value:(x.branch==='f2'?'f2':'f1'), note:$('soN').value}).then(function(){ toast('Сақланди'); invalidate(); closeDrawer(); vSalary(); }).catch(function(e){ busy(b,false); toast(errText(e),true); }); }; });
}
function planDrawer(x){
  var T=x.tiers.length?x.tiers.map(function(t){ return t.slice(); }):[[0,0.8],[800000000,1]], mode=x.mode||'all';
  var draw=function(){
    var h=drawerHead('Ойлик шарти — '+esc(x.name), 'Танланган ойдан бошлаб амал қилади, кейинги ойларга ҳам ўтади')+'<div class="db"><div class="grid-f"><label class="f">Қайси ойдан<input class="inp" type="month" id="plM" value="'+S.month+'"></label><label class="f">Оклад (ҳар ой)<input class="inp money" id="plO" inputmode="numeric" value="'+(x.oklad?fmt(x.oklad):'')+'"></label><label class="f">План (тушган пул)<input class="inp money" id="plP" inputmode="numeric" value="'+(x.plan?fmt(x.plan):'')+'"></label><label class="f">План бажарилса бонус<input class="inp money" id="plB" inputmode="numeric" value="'+(x.bonusAmt?fmt(x.bonusAmt):'')+'"></label></div>';
    h+='<h3 style="margin:8px 0 4px">Фоиз шкаласи</h3><div class="mut sm">Сотувчи бўлмаса (омборчи, юкчи), шкалани бўш қолдиринг — фақат оклад.</div><table><thead><tr><th>Тушган пул шундан бошлаб</th><th class="n">Фоиз</th><th></th></tr></thead><tbody>'+T.map(function(t,i){ return '<tr><td><input class="inp money" data-tf="'+i+'" inputmode="numeric" value="'+fmt(t[0])+'"></td><td class="n"><input class="inp qty" data-tp="'+i+'" inputmode="decimal" value="'+String(t[1]).replace('.',',')+'" style="width:80px"> %</td><td><button class="btn sm" type="button" data-td="'+i+'">×</button></td></tr>'; }).join('')+'</tbody></table><button class="btn sm" type="button" id="plAdd">+ Поғона қўшиш</button>';
    h+='<label class="f" style="margin-top:10px">Қандай ҳисобланади<select class="inp" id="plMd"><option value="all"'+(mode==='all'?' selected':'')+'>Етган поғона фоизи бутун суммага (масалан, 900 млн × 1%)</option><option value="step"'+(mode==='step'?' selected':'')+'>Ҳар поғона ўз фоизи билан (800 млн × 0,8% + 100 млн × 1%)</option></select></label>';
    h+='<button class="btn pri" type="button" id="plS" style="height:44px;margin-top:12px">Сақлаш</button></div>';
    openDrawer(h, function(d){ d.querySelector('[data-close]').onclick=function(){ salDrawer(x); };
      d.querySelectorAll('.money').forEach(function(i){ i.oninput=function(){ var v=pm(this.value); this.value=this.value.trim()?fmt(v):''; if(this.dataset.tf) T[+this.dataset.tf][0]=v; }; });
      d.querySelectorAll('[data-tp]').forEach(function(i){ i.oninput=function(){ T[+i.dataset.tp][1]=parseFloat(String(i.value).replace(',','.'))||0; }; });
      d.querySelectorAll('[data-td]').forEach(function(b){ b.onclick=function(){ T.splice(+b.dataset.td,1); keep(); draw(); }; });
      $('plMd').onchange=function(){ mode=this.value; };
      var keep=function(){ x={name:x.name,pos:x.pos,branch:x.branch,tiers:T,mode:mode,oklad:pm($('plO').value),plan:pm($('plP').value),bonusAmt:pm($('plB').value),b:x.b,base:x.base,ops:x.ops,setup:x.setup,accrued:x.accrued,left:x.left,adv:x.adv,paid:x.paid,fine:x.fine,extra:x.extra,pct:x.pct,pctAmt:x.pctAmt,planBonus:x.planBonus,tier:x.tier}; };
      $('plAdd').onclick=function(){ keep(); var l=T[T.length-1]; T.push([l?l[0]+100000000:0, l?Math.round((l[1]+0.1)*10)/10:1]); draw(); };
      $('plS').onclick=function(){ var b=this; busy(b,true); api('savePlan', S.token, {staff:x.name, month:$('plM').value, oklad:pm($('plO').value), plan:pm($('plP').value), bonus:pm($('plB').value), tiers:T, mode:$('plMd').value}).then(function(){ toast('Шарт сақланди'); invalidate(); closeDrawer(); vSalary(); }).catch(function(e){ busy(b,false); toast(errText(e),true); }); };
    });
  };
  draw();
}

    var h='<div class="card flush"><div class="toolbar"><b>'+mLabel(F.from)+(F.from!==F.to?' — '+mLabel(F.to):'')+'</b><span style="flex:1"></span><button class="btn sm" type="button" id="stX">'+ib('xls','Excel')+'</button></div><div class="tbl"><table class="jt"><thead><tr><th>Ходим</th><th class="n">Бошидаги қолдиқ</th><th class="n">Ҳисобланди</th><th class="n">Берилди</th><th class="n">Охирги қолдиқ</th></tr></thead><tbody>'+(L.length?L.map(function(o){ return '<tr><td><b>'+esc(o.name)+'</b></td><td class="n">'+fmt(o.open)+'</td><td class="n">'+fmt(o.acc)+'</td><td class="n">'+fmt(o.paid)+'</td><td class="n '+(o.close>0?'neg':(o.close<0?'pos':'mut'))+'"><b>'+fmt(o.close)+'</b></td></tr>'; }).join(''):'<tr><td colspan="5" class="empty">Маълумот йўқ.</td></tr>')+'</tbody><tfoot><tr><td>Жами</td><td class="n">'+fmt(t.open)+'</td><td class="n">'+fmt(t.acc)+'</td><td class="n">'+fmt(t.paid)+'</td><td class="n">'+fmt(t.close)+'</td></tr></tfoot></table></div><div class="pager"><span>Охирги қолдиқ мусбат — ходимга қарзмиз, манфий — ходим ортиқча олган (аванс).</span></div></div>';
    setView(h); $('stX').onclick=function(){ xls('Ходимлар ҳисоби', ['Ходим','Бошида','Ҳисобланди','Берилди','Охирида'], L.map(function(o){ return [o.name,o.open,o.acc,o.paid,o.close]; })); };
  }).catch(failView);
}
var MSRC={sale:'Сотув',pay:'Қарз тўлови',ret:'Қайтариш',exp:'Харажат',otk:'Откат',sup:'Таъминотчи',ext:'Юк ташиш',comm:'Комиссия',own:'Хўжайин',sal:'Ойлик',in:'Пул қўшилди',out:'Топширилди / олинди',open:'Бошланғич қолдиқ',count:'Санаш фарқи'};
function vMflow(){
  var F=S.mff||(S.mff={from:thisMonth()+'-01', to:today(), box:'', src:''});
  topActs('<input class="inp" type="date" id="mfF" value="'+F.from+'"><span class="mut">—</span><input class="inp" type="date" id="mfT" value="'+F.to+'">', function(){ $('mfF').onchange=function(){ F.from=this.value; vMflow(); }; $('mfT').onchange=function(){ F.to=this.value; vMflow(); }; });
  loadingView();
  api('moneyFlows', S.token, F.from, F.to).then(function(r){
    var draw=function(){ var t={open:0,in:0,out:0,close:0}; r.boxes.forEach(function(b){ for(var k in t) t[k]+=b[k]; }); var lab={}; r.boxes.forEach(function(b){ lab[b.key]=b.label; });
      var h='<div class="card flush"><div class="toolbar"><b>Кассалар</b></div><div class="tbl"><table class="jt"><thead><tr><th>Касса</th><th class="n">Бошида</th><th class="n">Кирим</th><th class="n">Чиқим</th><th class="n">Охирида</th></tr></thead><tbody>'+r.boxes.map(function(b){ return '<tr class="click'+(F.box===b.key?' sel':'')+'" data-bx="'+b.key+'"><td><b>'+b.label+'</b></td><td class="n">'+fmt(b.open)+'</td><td class="n pos">'+(b.in?'+'+fmt(b.in):'—')+'</td><td class="n neg">'+(b.out?'−'+fmt(b.out):'—')+'</td><td class="n"><b>'+fmt(b.close)+'</b></td></tr>'; }).join('')+'</tbody><tfoot><tr><td>Жами</td><td class="n">'+fmt(t.open)+'</td><td class="n">+'+fmt(t.in)+'</td><td class="n">−'+fmt(t.out)+'</td><td class="n">'+fmt(t.close)+'</td></tr></tfoot></table></div></div>';
      var L=r.list.filter(function(x){ return (!F.box||x.box===F.box)&&(!F.src||x.src===F.src); }), srcs={}; r.list.forEach(function(x){ srcs[x.src]=1; });
      h+='<div class="card flush"><div class="toolbar"><b>Пул ҳаракати'+(F.box?' — '+lab[F.box]:'')+'</b><select class="inp" id="mfS"><option value="">Ҳамма турлар</option>'+Object.keys(srcs).map(function(k){ return '<option value="'+k+'"'+(F.src===k?' selected':'')+'>'+(MSRC[k]||k)+'</option>'; }).join('')+'</select>'+(F.box?'<button class="btn sm" type="button" id="mfA">Ҳамма кассалар</button>':'')+'<span style="flex:1"></span><button class="btn sm" type="button" id="mfX">'+ib('xls','Excel')+'</button></div><div class="tbl"><table class="jt cards"><thead><tr><th>Сана</th><th>Касса</th><th>Тури</th><th>Изоҳ</th><th class="n">Кирим</th><th class="n">Чиқим</th></tr></thead><tbody>'+(L.length?L.slice(0,500).map(function(x){ return '<tr><td class="c-date">'+dLabel(x.date)+'</td><td class="c-x mut">'+lab[x.box]+'</td><td class="c-main">'+(MSRC[x.src]||x.src)+'</td><td class="c-tag mut sm" style="white-space:normal">'+esc(x.ref)+'</td><td class="n pos c-money">'+(x.amt>0?fmt(x.amt):'')+'</td><td class="n neg c-money">'+(x.amt<0?fmt(-x.amt):'')+'</td></tr>'; }).join(''):'<tr><td colspan="6" class="empty">Ҳаракат йўқ.</td></tr>')+'</tbody></table></div><div class="pager"><span>'+L.length+' та ҳаракат'+(L.length>500?' (биринчи 500 таси кўрсатилди, ҳаммаси Excel\'да)':'')+'</span></div></div>';
      setView(h);
      $('view').querySelectorAll('[data-bx]').forEach(function(tr){ tr.onclick=function(){ F.box=F.box===tr.dataset.bx?'':tr.dataset.bx; draw(); }; });
      $('mfS').onchange=function(){ F.src=this.value; draw(); }; if($('mfA')) $('mfA').onclick=function(){ F.box=''; draw(); };
      $('mfX').onclick=function(){ xls('Пул ҳаракати '+F.from+'_'+F.to, ['Сана','Касса','Тури','Изоҳ','Сумма'], L.map(function(x){ return [dLabel(x.date), lab[x.box], MSRC[x.src]||x.src, x.ref, x.amt]; })); };
    }; draw();
  }).catch(failView);
}
function vSettings(){
  var h='<div class="row2"><div class="card"><h2>Доллар курси</h2><div class="mut sm" style="margin-bottom:10px">Долларда келган приходда шу курс автоматик қўйилади (приходда ўзгартириш ҳам мумкин).</div><div class="ctrl"><input class="inp money" id="usdIn" inputmode="numeric" value="'+(S.usd?fmt(S.usd):'')+'" placeholder="12 200" style="width:160px"><span class="mut">сўм = 1 $</span><button class="btn pri" type="button" id="usdSave">Сақлаш</button></div></div>';
  h+='<div class="card"><h2>Банк комиссияси</h2><div class="mut sm" style="margin-bottom:10px">Пластик, Click ва перечисление орқали тушган пулдан банк ушлайдиган фоиз. Фойда-зарарда «Комиссия» бўлиб ўзи айрилади.</div><div class="grid-f">'+[['plastik','Пластик (терминал)'],['click','Click'],['perech','Перечисление']].map(function(k){ return '<label class="f">'+k[1]+', %<input class="inp qty" data-cm="'+k[0]+'" inputmode="decimal" value="'+((S.comm||{})[k[0]]||'')+'" placeholder="0"></label>'; }).join('')+'</div><button class="btn pri" type="button" id="cmSave" style="margin-top:10px">Сақлаш</button></div>';
  h+='<div class="card"><h2>Қолдиқ етмаса сотиш</h2><div class="mut sm" style="margin-bottom:10px">Омборда товар етмаганда сотув ёки кўчиришга рухсат берилсинми?</div><select class="inp" id="negSel" style="width:100%"><option value="none"'+(S.neg==='none'?' selected':'')+'>Ҳеч кимга рухсат йўқ</option><option value="admin"'+(S.neg==='admin'?' selected':'')+'>Фақат админга (сотувчиларга йўқ)</option><option value="all"'+(S.neg==='all'?' selected':'')+'>Ҳаммага (фақат огоҳлантириш)</option></select></div>';
  h+='<div id="usrBox" style="flex-basis:100%"></div><div id="permBox" style="flex-basis:100%"></div>';
  if(isAdmin()) h+='<div class="card" style="flex-basis:100%"><h2>Захира нусха</h2><div class="mut sm" style="margin-bottom:12px">Сервер ҳар кеча бутун базанинг нусхасини ўзи олади ва 14 кун сақлайди. Бундан ташқари ҳафтада бир марта шу тугмани босиб, файлни компьютерингизга ёки Google Drive\'га сақлаб қўйинг. Файлда парол хешлари бор: бегонага берманг.</div><button class="btn pri" type="button" id="bkDl">'+ib('xls','Захирани юклаб олиш')+'</button> <span class="mut sm" id="bkInfo"></span></div>';
  setView(h); usersBox(); permBox();
  if($('bkDl')) $('bkDl').onclick=function(){ var b=this; busy(b,true); api('exportAll', S.token).then(function(d){ var n=0; Object.keys(d.sheets).forEach(function(k){ n+=d.sheets[k].rows.length; }); var blob=new Blob([JSON.stringify(d)],{type:'application/json'}), a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='nurmetall-zaxira-'+today()+'.json'; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1000); busy(b,false); $('bkInfo').textContent=n+' та ёзув, '+Math.round(blob.size/1024)+' КБ'; toast('Захира юклаб олинди'); }).catch(function(e){ busy(b,false); toast(errText(e),true); }); };
  $('cmSave').onclick=function(){ var b=this, o={}; $('view').querySelectorAll('[data-cm]').forEach(function(i){ o[i.dataset.cm]=parseFloat(String(i.value).replace(',','.'))||0; }); busy(b,true); api('setComm', S.token, o).then(function(r){ S.comm=r; busy(b,false); invalidate(); toast('Сақланди'); }).catch(function(e){ busy(b,false); toast(errText(e),true); }); };
  $('negSel').onchange=function(){ var v=this.value; api('setNegPolicy', S.token, v).then(function(){ S.neg=v; toast('Сақланди'); }).catch(function(e){ toast(errText(e),true); }); };
  $('usdIn').oninput=function(){ var v=pm(this.value); this.value=this.value.trim()?fmt(v):''; };
  $('usdSave').onclick=function(){ var b=this; busy(b,true); api('setUsdRate', S.token, pm($('usdIn').value)).then(function(r){ S.usd=r; busy(b,false); toast('Курс сақланди: '+fmt(r)); }).catch(function(e){ busy(b,false); toast(errText(e),true); }); };
}

/* ---------- login & start ---------- */
function toLogin(msg){ S.token=null; try{ localStorage.removeItem('nim_token'); }catch(_){} closeDrawer(); $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('lErr').textContent=msg||''; $('lPass').value=''; }
function start(){
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  setView('<div class="card empty">Юкланмоқда…</div>');
  refreshBoot().then(function(){
    $('uName').textContent=S.me.name; $('ava').textContent=(S.me.name||'?').charAt(0).toUpperCase();
    $('uRole').textContent=(ROLES[S.me.role]||S.me.role)+(S.me.branch&&S.me.branch!=='all'?' · '+BR[S.me.branch]:'');
    if(S.me.role!=='admin' && S.me.role!=='viewer' && S.me.branch && S.me.branch!=='all'){ S.branch=S.me.branch; $('branchSel').value=S.branch; $('branchSel').disabled=true; }
    go(S.view||'home');
  }).catch(function(e){ if(!/SESSION/.test(String(e&&e.message||e))) failView(e); });
}
$('loginForm').addEventListener('submit', function(ev){ ev.preventDefault(); $('lErr').textContent=''; var b=$('lBtn'); b.disabled=true; b.textContent='Текширилмоқда…';
  call('login', $('lLogin').value, $('lPass').value).then(function(r){ S.token=r.token; try{ localStorage.setItem('nim_token', r.token); }catch(_){} $('lPass').value=''; start(); })
  .catch(function(e){ $('lErr').textContent=errText(e); }).then(function(){ b.disabled=false; b.textContent='Кириш'; }); });
$('logoutBtn').onclick=function(){ var t=S.token; toLogin(''); call('logout', t).catch(function(){}); };
$('navList').onclick=function(e){
  var g=e.target.closest('[data-g]'); if(g){ S.open[g.dataset.g]=!S.open[g.dataset.g]; renderNav(); return; }
  var b=e.target.closest('[data-v]'); if(b) go(b.dataset.v);
};
$('branchSel').onchange=function(){ S.branch=this.value; closeDrawer(); render(); };
$('refreshBtn').onclick=function(){ invalidate(); refreshBoot().then(render).then(function(){ toast('Янгиланди'); }).catch(function(e){ toast(errText(e),true); }); };
$('themeBtn').onclick=function(){ var d=document.body.dataset.theme==='dark'?'':'dark'; document.body.dataset.theme=d; try{ localStorage.setItem('nim_theme', d); }catch(_){} };
$('menuBtn').onclick=function(){ document.body.classList.toggle('mnav'); };
$('scrim').onclick=function(){ closeDrawer(); document.body.classList.remove('mnav'); };
document.addEventListener('keydown', function(e){ if(e.key==='Escape' && document.body.classList.contains('dr')) closeDrawer(); });
(function init(){
  S.month=thisMonth();
  try{ var th=localStorage.getItem('nim_theme'); if(th) document.body.dataset.theme=th; }catch(_){}
  var t=null; try{ t=localStorage.getItem('nim_token'); }catch(_){}
  if(!t){ $('lLogin').focus(); return; }
  call('me', t).then(function(){ S.token=t; start(); }).catch(function(){ toLogin(''); });
})();
</script>
