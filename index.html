<!DOCTYPE html>
<html lang="uz">
<head>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0F6E80"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nur Islam Metal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F1FB;--side:#FFFFFF;--card:#FFFFFF;--ink:#1E1B2E;--muted:#5F5B73;--line:#E7E4F0;--soft:#F7F6FC;
--a1:#6C5CE7;--a1ink:#FFFFFF;--a2:#D97706;--act:#E9E4FF;--actink:#4B3BB5;--pos:#0F7A55;--neg:#C0263F;
--k1:#FFF1E3;--k2:#EEEAFE;--k3:#E3F6F1;--k4:#FDE8EE;--k5:#E8F1FD;--k6:#F4F1E8;--r:16px;--th:#F1EFF9}
body[data-theme=dark]{--bg:#0E1116;--side:#151A21;--card:#171C24;--ink:#EEF2F6;--muted:#A1ABB8;--line:#262E39;--soft:#1B212A;
--a1:#2DD4BF;--a1ink:#0E1116;--a2:#FBBF24;--act:#1F2731;--actink:#5EEAD4;--pos:#34D399;--neg:#FB7185;
--k1:#171C24;--k2:#171C24;--k3:#171C24;--k4:#171C24;--k5:#171C24;--k6:#171C24;--th:#1B212A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45}
h1,h2,h3{font-family:Inter,sans-serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
nav.side{flex:none;width:246px;background:var(--side);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 16px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--a1);color:var(--a1ink);display:flex;align-items:center;justify-content:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:14px;flex:none}
.brand b{display:block;font-family:Inter,system-ui,sans-serif;font-size:16px}.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;border:0;background:transparent;color:var(--muted);cursor:pointer;text-align:left;font-weight:500;width:100%}
.nav:hover{background:var(--soft)}.nav.on{background:var(--act);color:var(--actink);font-weight:600}
.nav svg{flex:none}.nav .chev{margin-left:auto;transition:transform .15s}.grp.open>.nav .chev{transform:rotate(90deg)}
.grp.cur>.nav{color:var(--ink);font-weight:600}
.navsub{display:none;flex-direction:column;gap:1px;padding:2px 0 6px 31px}.grp.open .navsub{display:flex}
.navsub .nav{padding:7px 12px;font-size:13.5px}
.side .foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.ava{width:34px;height:34px;border-radius:99px;background:var(--a2);color:#1a1a1a;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
main{flex:1;min-width:0;padding:20px 26px 60px;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
header.top h1{font-size:23px}
.crumb{font-size:12px;color:var(--muted)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inp,select.inp{height:38px;padding:0 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);min-width:0}
textarea.inp{height:auto;padding:8px 12px}
.inp:focus{outline:2px solid var(--a1);outline-offset:-1px;border-color:transparent}
.money,.qty{text-align:right;font-variant-numeric:tabular-nums}
.btn{height:38px;padding:0 15px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:hover{border-color:var(--a1)}
.btn.pri{background:var(--a1);color:var(--a1ink);border-color:var(--a1);font-weight:600}
.btn.acc{background:var(--a2);color:#1a1a1a;border-color:var(--a2);font-weight:600}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn.danger{color:var(--neg)}.btn.armed{background:var(--neg);color:#fff;border-color:var(--neg)}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.card h2{font-size:16px;margin-bottom:12px}
.card.flush{padding:0;overflow:hidden}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.kpi{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi .l{font-size:13px;color:var(--muted)}.kpi .v{font-family:Inter,system-ui,sans-serif;font-size:22px;font-weight:700;white-space:nowrap}
.kpi .d{font-size:12px;color:var(--muted)}
.row2{display:flex;flex-wrap:wrap;gap:16px}.row2>*{flex:1 1 320px;min-width:0}
.grid-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
label.f .inp{color:var(--ink);font-size:14px}
label.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
.jt thead th{background:var(--th);position:sticky;top:0}
.jt tfoot td{background:var(--th);font-weight:700;border-bottom:0}
.jt td{white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%;border-radius:4px}
.lead td{vertical-align:middle}.lead td.rk{width:28px;font-weight:700;color:var(--muted);font-size:15px}.lead tr.me td{background:var(--soft)}.kpi.click{cursor:pointer}.kpi.click:hover{border-color:#C9CED6}
.perm input[type=checkbox]{width:18px;height:18px;accent-color:var(--a1);cursor:pointer}.perm td:first-child{white-space:normal;min-width:240px}
.pill.boss{background:#FFF4D6;color:#8A5A00;border-color:transparent;font-weight:600}body[data-theme=dark] .pill.boss{background:#3A2E10;color:#F5C451}
.ctip{position:fixed;display:none;z-index:99;background:var(--ink);color:var(--card);padding:5px 9px;border-radius:8px;font-size:12px;pointer-events:none;white-space:nowrap}
.jt th.cur{color:var(--actink)}
.posg .line{grid-template-columns:minmax(150px,2.4fr) 72px 84px 110px minmax(92px,1fr) 30px;gap:6px}
.posg .grid-f{grid-template-columns:repeat(2,minmax(0,1fr))}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
tr.sel td{background:var(--act)!important}
tr.void td{opacity:.45;text-decoration:line-through}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
tr.sub td{font-weight:600;background:var(--soft)}
td.ind{padding-left:24px;color:var(--muted)}
.tbl{overflow-x:auto}
.docno{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:24px;padding:0 7px;border-radius:7px;background:var(--act);color:var(--actink);font-weight:600;font-size:12.5px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--muted)}.sm{font-size:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.toolbar .inp{height:36px}
.toolbar .grow{flex:1 1 200px}
.pager{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.pager .pg{display:flex;gap:4px}
.pager button{min-width:32px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.pager button.on{background:var(--a1);color:var(--a1ink);border-color:var(--a1)}
.lines{display:flex;flex-direction:column;gap:10px}
.line{display:grid;grid-template-columns:minmax(200px,3fr) 90px minmax(90px,1fr) minmax(110px,1.3fr) minmax(110px,1.2fr) 36px;gap:8px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}
.line .info{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-2px}
.line .sum{height:38px;display:flex;align-items:center;justify-content:flex-end;font-weight:600}
@media(max-width:700px){.line{grid-template-columns:1fr 1fr}.line .lp{grid-column:1/-1}}
.x{width:36px;height:38px;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;border-radius:8px}.x:hover{color:var(--neg);background:var(--k4)}
.totals{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.totrow{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.big{font-family:Inter,system-ui,sans-serif;font-size:22px;font-weight:700}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--k3);color:var(--pos);border-color:transparent}
.pill.warn{background:var(--k4);color:var(--neg);border-color:transparent}
.pill.info{background:var(--k5);border-color:transparent}
.empty{color:var(--muted);padding:16px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:500;z-index:80;max-width:90vw;display:none}
#toast.err{background:var(--neg);color:#fff}
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:70;padding:20px}
#login .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
#login .err{color:var(--neg);font-size:13px;min-height:18px}
.hidden{display:none!important}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#view{display:flex;flex-direction:column;gap:16px}
/* drawer */
#scrim{position:fixed;inset:0;background:rgba(20,16,40,.32);z-index:50;display:none}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100vw);background:var(--card);z-index:60;box-shadow:-10px 0 40px rgba(20,16,40,.18);display:none;flex-direction:column}
body.dr #scrim{display:block}body.dr #drawer{display:flex}
.dh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.dh h2{font-size:18px}
#drawer a{color:var(--actink);font-weight:600}
.dacts{display:flex;flex-wrap:wrap;gap:6px;padding:10px 18px;border-bottom:1px solid var(--line)}
.db{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.db>*{flex-shrink:0}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;background:var(--soft);border-radius:12px;padding:12px 14px}
.meta div{display:flex;flex-direction:column;gap:2px}.meta span{font-size:12px;color:var(--muted)}
/* POS */
.posg{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr);gap:16px;align-items:start}
@media(max-width:1100px){.posg{grid-template-columns:1fr}}
.pick{position:sticky;top:12px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 24px)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px}
.chip.on{background:var(--a1);color:var(--a1ink);border-color:var(--a1)}
.plist{overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px}
.pt{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;text-align:left;width:100%}
.pt:hover{border-color:var(--a1);background:var(--soft)}
.pt b{display:block;font-weight:600}.pt .r{text-align:right;white-space:nowrap}
#printArea{display:none}
@media print{
 body.printing>*{display:none!important}
 body.printing #printArea{display:block!important}
 body.printing{background:#fff;color:#000}
}
.rc{width:72mm;font:12px/1.4 'Courier New',Courier,monospace;color:#000;padding:1mm}
.rc .c{text-align:center}.rc .r{display:flex;justify-content:space-between;gap:6px}.rc .hr{border-top:1px dashed #000;margin:4px 0}.rc b{font-weight:700}.rc .big{font-size:15px;font-family:inherit}
#mbar{display:none}
.pk-close{display:none}
.pv{font-family:Inter,Arial,sans-serif;color:#000;font-size:12px;padding:8mm}
.pv h2{font-size:18px;margin:0 0 4px}
.pv .ph{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:10px}
.pv table{border-collapse:collapse;width:100%;margin:8px 0}
.pv th,.pv td{border:1px solid #444;padding:5px 7px;color:#000;font-size:12px;text-align:left}
.pv td.n,.pv th.n{text-align:right}
.pv .sig{display:flex;justify-content:space-between;margin-top:36px;gap:30px}
.pv .sig div{flex:1;border-top:1px solid #000;padding-top:4px;font-size:11px}
.menu-btn{display:none}
.pkbtn{display:none!important}
@media(max-width:900px){
 .cvg{grid-template-columns:1fr!important}
 .posg .line{grid-template-columns:1fr 1fr}.posg .line .lp{grid-column:1/-1}
 .posg .pick{display:none}
 body.pkopen .posg .pick{display:flex;position:fixed;inset:0;z-index:66;border-radius:0;max-height:none;padding:14px}
 body.pkopen .pk-close{display:flex}
 #mbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:10px 12px;gap:10px;align-items:center;box-shadow:0 -6px 20px rgba(20,16,40,.08)}
 body.saleview #mbar{display:flex}
 body.saleview main{padding-bottom:96px}
 .pkbtn{display:flex!important}
 nav.side{position:fixed;left:0;top:0;bottom:0;z-index:65;transform:translateX(-105%);transition:transform .2s;box-shadow:10px 0 40px rgba(20,16,40,.2)}
 body.mnav nav.side{transform:none}body.mnav #scrim{display:block}
 .menu-btn{display:flex}
 main{padding:14px 12px 60px}header.top h1{font-size:20px}
}
#tabbar{display:none}
@media(max-width:900px){
 #tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 #tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font-size:11px;padding:4px 0;cursor:pointer}
 #tabbar button.on{color:var(--ink);font-weight:600}
 body.saleview #tabbar{display:none}
 main{padding-bottom:90px}
 #themeBtn{display:none}
 header.top{gap:8px}header.top .ctrl{width:100%}
 .kpis{grid-template-columns:1fr 1fr!important}.kpi{border-bottom:1px solid var(--line)}.kpi .v{font-size:21px!important}
 .card.flush .toolbar{flex-wrap:wrap}
}
@media(max-width:700px){
 .jt.cards thead{display:none}
 .jt.cards,.jt.cards tbody,.jt.cards tfoot{display:block}
 .jt.cards tr{display:grid;grid-template-columns:auto 1fr auto;column-gap:10px;row-gap:3px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
 .jt.cards td{border:0;padding:0;white-space:normal;background:none!important}
 .jt.cards td.c-x{display:none}
 .jt.cards td:first-child{grid-column:1;grid-row:1}
 .jt.cards td.c-date{grid-column:2;grid-row:1;color:var(--muted);font-size:12.5px}
 .jt.cards td.c-money{grid-column:3;grid-row:1/3;text-align:right;font-weight:600;font-size:15px}
 .jt.cards td.c-main{grid-column:1/3;grid-row:2;font-size:15px}
 .jt.cards td.c-tag{grid-column:1/-1;text-align:left}
 .jt.cards td.c-act{grid-column:3;grid-row:3;text-align:right}
 .jt.cards td.c-tag:has(> span.mut:only-child){display:none}
 .jt.cards td.c-tag:empty{display:none}
 .jt.cards tr:has(td.c-main:first-child) td.c-date{grid-column:1/3;grid-row:1}
 .jt.cards tr:has(td.c-main:first-child) td.c-main{grid-row:2}
 .jt.cards tfoot tr{background:var(--th);font-weight:700}
 .jt.cards td.empty{grid-column:1/-1}
}
/* ---- Минимал дизайн ---- */
:root{--bg:#F7F8FA;--side:#FFFFFF;--card:#FFFFFF;--ink:#101828;--muted:#667085;--line:#EAECF0;--soft:#F4F5F7;--a1:#111827;--a1ink:#FFFFFF;--a2:#2F6FED;--act:#F2F4F7;--actink:#101828;--pos:#0E8A5F;--neg:#D92D20;--k1:#fff;--k2:#fff;--k3:#fff;--k4:#fff;--k5:#fff;--k6:#fff;--r:12px;--th:#FAFAFB}
body[data-theme=dark]{--bg:#0C0E12;--side:#111418;--card:#15181D;--ink:#F2F4F7;--muted:#98A2B3;--line:#252A31;--soft:#1B1F25;--a1:#F2F4F7;--a1ink:#0C0E12;--a2:#5B8CFF;--act:#1F242B;--actink:#FFFFFF;--pos:#3CCB8F;--neg:#F97066;--k1:#15181D;--k2:#15181D;--k3:#15181D;--k4:#15181D;--k5:#15181D;--k6:#15181D;--th:#181B20}
body{font-family:Inter,system-ui,sans-serif;font-feature-settings:'cv11','ss01'}
h1,h2,h3,.kpi .v,.brand b,.logo{font-family:Inter,sans-serif;letter-spacing:-.02em}
header.top h1{font-size:28px;font-weight:650}
.card h2{font-size:15px;font-weight:600}
nav.side{border-right:1px solid var(--line);padding-top:22px}
nav.side .logo{border-radius:9px;background:var(--a1);color:var(--a1ink);font-size:13px}
nav.side .nav{color:var(--muted);border-radius:8px}
nav.side .nav:hover{background:var(--soft);color:var(--ink)}
nav.side .nav.on{background:var(--act);color:var(--ink);font-weight:600}
nav.side .grp.cur>.nav{color:var(--ink)}
.kpis{gap:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kpi{background:var(--card)!important;border:0;border-right:1px solid var(--line);border-radius:0;padding:18px 22px}
.kpi:last-child{border-right:0}
.kpi .l{font-size:13px;font-weight:500}
.kpi .v{font-size:28px;font-weight:600}
.card{border-color:var(--line);box-shadow:none}
.btn{border-radius:9px;font-weight:500}
.btn.pri{background:var(--a1);border-color:var(--a1);color:var(--a1ink)}
.btn.acc{background:var(--a2);border-color:var(--a2);color:#fff}
.btn:hover{border-color:#C9CED6}
.inp,select.inp{border-radius:9px}
.inp:focus{outline:2px solid var(--a2)}
.jt thead th{background:var(--card);color:var(--muted);font-weight:500;border-bottom:1px solid var(--line)}
.jt tfoot td{background:var(--th)}
tr.tot td{border-top:1.5px solid var(--ink)}
.pill{border-radius:6px}
.chip.on{background:var(--a1);color:var(--a1ink);border-color:var(--a1)}
.pill.ok{background:#E8F6EF}.pill.warn{background:#FEEEEC}.pill.info{background:#EBF1FE;color:#2450B8}
body[data-theme=dark] .pill.ok{background:#12291F}body[data-theme=dark] .pill.warn{background:#2E1714}body[data-theme=dark] .pill.info{background:#16213A;color:#9DB8FF}
body{font-optical-sizing:auto}
.lang{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:4px}.lang button{font:inherit;font-size:13px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted,#667085);cursor:pointer}.lang button.on{background:var(--ink,#111827);color:#fff;border-color:var(--ink,#111827)}.lang-sel{width:auto;height:32px;padding:0 6px;font-size:12px;margin-right:4px}

/* ==== Б4 Феруза шиша (2026-11) ==== */
:root{--bg:#E9F3F6;--side:rgba(246,251,252,.82);--card:rgba(255,255,255,.86);--ink:#0F1720;--muted:#56606B;--line:rgba(15,70,85,.11);--soft:rgba(255,255,255,.62);
--a1:#0F6E80;--a1ink:#FFFFFF;--a2:#E8902A;--act:rgba(255,255,255,.86);--actink:#0F6E80;--pos:#0E8A5F;--neg:#B42318;
--k1:transparent;--k2:transparent;--k3:transparent;--k4:transparent;--k5:transparent;--k6:transparent;--r:18px;--th:rgba(243,250,252,.94);
--glass:blur(22px) saturate(180%);--sh:0 1px 2px rgba(15,23,32,.05),0 10px 30px rgba(15,80,100,.10);--spring:cubic-bezier(.22,1.4,.36,1)}
body[data-theme=dark]{--bg:#0B1418;--side:rgba(16,28,34,.9);--card:rgba(20,34,41,.9);--ink:#EAF4F6;--muted:#9FB3BA;--line:rgba(160,220,230,.10);--soft:rgba(255,255,255,.06);
--a1:#2BB3C8;--a1ink:#06222A;--a2:#F5B544;--act:rgba(43,179,200,.16);--actink:#7FE0EE;--pos:#3CCB8F;--neg:#F97066;--th:rgba(22,38,45,.96);
--sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35)}
body,h1,h2,h3,.kpi .v,.brand b,.logo,.big,.pv{font-family:'Onest',Inter,system-ui,sans-serif}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
background-color:var(--bg);background-attachment:fixed;background-image:
radial-gradient(620px 460px at 12% 14%,rgba(15,110,128,.36),transparent 68%),
radial-gradient(760px 560px at 90% 86%,rgba(15,110,128,.30),transparent 68%),
radial-gradient(520px 380px at 62% 4%,rgba(110,150,255,.24),transparent 68%),
radial-gradient(460px 360px at 40% 98%,rgba(255,255,255,.7),transparent 70%)}
body[data-theme=dark]{background-image:
radial-gradient(620px 460px at 12% 14%,rgba(43,179,200,.22),transparent 68%),
radial-gradient(760px 560px at 90% 86%,rgba(43,179,200,.16),transparent 68%),
radial-gradient(520px 380px at 62% 4%,rgba(110,120,255,.16),transparent 68%)}

#login .box,#drawer{backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
nav.side{border-right:1px solid rgba(255,255,255,.7)}
body[data-theme=dark] nav.side{border-right-color:var(--line)}
@media (max-width:900px){nav.side{background:rgba(240,248,250,.9)}body[data-theme=dark] nav.side{background:rgba(14,24,29,.94)}}
.card,.kpi,#login .box{border:1px solid rgba(255,255,255,.75);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.7)}
body[data-theme=dark] .card,body[data-theme=dark] .kpi,body[data-theme=dark] #login .box{border-color:var(--line);box-shadow:var(--sh)}
#drawer{background:rgba(248,252,253,.9)}body[data-theme=dark] #drawer{background:rgba(16,28,34,.94)}
#scrim{background:rgba(10,40,50,.32)}
#login{background:transparent}
.kpis{gap:14px;background:transparent;border:0;overflow:visible}
.kpi{background:var(--card)!important;border-radius:var(--r);padding:18px 22px}
.kpi:last-child{border-right:1px solid rgba(255,255,255,.75)}
.jt thead th{background:var(--th)}
.logo{background:linear-gradient(160deg,#1A8CA1,#0F6E80)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 12px rgba(15,110,128,.3)}
/* menu */
nav.side .nav{border-radius:12px;transition:background-color .3s ease,box-shadow .3s ease,color .2s}
nav.side .nav:hover{background:rgba(255,255,255,.72);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 6px 18px rgba(15,23,32,.07);color:var(--ink)}
nav.side .nav.on{background:var(--act);color:var(--actink);box-shadow:inset 0 1px 0 #fff,0 4px 14px rgba(15,110,128,.12)}
body[data-theme=dark] nav.side .nav:hover{background:rgba(255,255,255,.07);box-shadow:none}
body[data-theme=dark] nav.side .nav.on{box-shadow:none}
/* inputs */
.inp,select.inp{border-radius:12px;background:rgba(255,255,255,.9);border-color:rgba(15,70,85,.12)}
body[data-theme=dark] .inp,body[data-theme=dark] select.inp{background:rgba(255,255,255,.05);border-color:var(--line)}
.inp:focus{outline:2px solid rgba(15,110,128,.45)}
/* buttons */
.btn,.icon-btn{--mx:50%;--my:50%;position:relative;overflow:hidden;isolation:isolate;border-radius:999px!important;-webkit-tap-highlight-color:transparent;transition:transform .35s var(--spring),box-shadow .35s ease,border-color .3s}
.btn{background:rgba(255,255,255,.85);border-color:rgba(255,255,255,.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 1px 2px rgba(15,23,32,.06)}
.icon-btn{border-radius:50%!important;background:rgba(255,255,255,.85);border-color:rgba(255,255,255,.9)}
body[data-theme=dark] .btn:not(.pri):not(.acc):not(.armed),body[data-theme=dark] .icon-btn{background:rgba(255,255,255,.06);border-color:var(--line);box-shadow:none}
.btn.pri{background:var(--a1);border-color:transparent;color:var(--a1ink);background-image:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,0) 52%,rgba(0,0,0,.14));box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(0,0,0,.18),0 1px 2px rgba(15,23,32,.2),0 8px 20px rgba(15,110,128,.30)}
.btn.acc{background:var(--a2);border-color:transparent;color:#1a1206;background-image:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 52%,rgba(0,0,0,.1));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 20px rgba(232,144,42,.28)}
.btn.armed{background:var(--neg);color:#fff;border-color:transparent}
.btn::after,.icon-btn::after{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 140% at 50% 0%,rgba(255,255,255,.75),rgba(15,110,128,.12) 60%,transparent 85%);opacity:0;transition:opacity .4s ease;pointer-events:none;z-index:-1}
.btn.pri::after,.btn.acc::after,.btn.armed::after{background:radial-gradient(120% 140% at 50% 0%,rgba(255,255,255,.42),rgba(255,255,255,.10) 55%,transparent 80%);z-index:0}
.btn:hover::after,.icon-btn:hover::after{opacity:1}
.btn:hover{border-color:rgba(255,255,255,.95);box-shadow:inset 0 1px 0 #fff,0 8px 20px rgba(15,23,32,.10),0 0 0 1px rgba(15,110,128,.30),0 0 18px 2px rgba(64,200,210,.35)}
.btn.pri:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(0,0,0,.18),0 2px 4px rgba(15,23,32,.18),0 14px 30px rgba(15,110,128,.38),0 0 22px 2px rgba(64,200,210,.45)}
.btn.acc:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 12px 26px rgba(232,144,42,.36),0 0 20px 2px rgba(255,196,110,.45)}
.icon-btn:hover{box-shadow:0 0 0 1px rgba(15,110,128,.3),0 0 16px 2px rgba(64,200,210,.3)}
.btn::before,.icon-btn::before{content:'';position:absolute;left:var(--mx);top:var(--my);width:14px;height:14px;border-radius:50%;background:rgba(15,110,128,.22);transform:translate(-50%,-50%) scale(24);opacity:0;transition:transform .65s cubic-bezier(.2,.8,.2,1),opacity .8s ease-out;pointer-events:none;z-index:-1}
.btn.pri::before,.btn.acc::before,.btn.armed::before{background:rgba(255,255,255,.55);z-index:0}
.btn:active:not(:disabled),.icon-btn:active{transform:scale(.955);transition-duration:.14s}
.btn:active:not(:disabled)::before,.icon-btn:active::before{transform:translate(-50%,-50%) scale(0);opacity:1;transition:0s}
.btn:focus-visible,.icon-btn:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(15,110,128,.45)}
.btn:disabled{transform:none}
.btn>*{position:relative;z-index:1}
.chip{border-radius:999px}
.chip.on{background:var(--a1);border-color:var(--a1);color:var(--a1ink)}
tbody tr{transition:background-color .25s}
tbody tr:hover>td{background:rgba(255,255,255,.55)}
body[data-theme=dark] tbody tr:hover>td{background:rgba(255,255,255,.04)}
/* ---- қиш ---- */
.nim-snow,.nim-frost{position:fixed;inset:0;z-index:-1;pointer-events:none;display:none}
body.winter .nim-snow,body.winter .nim-frost{display:block}
.nim-snow{background-repeat:repeat}
.nim-frost{background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0) 20%),radial-gradient(120% 50% at 50% 118%,rgba(255,255,255,.55),transparent 60%)}
body[data-theme=dark] .nim-frost{opacity:.15}
body[data-theme=dark] .nim-snow{opacity:.28!important}
body[data-theme=dark] .btn.pri{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 20px rgba(43,179,200,.25)}

.nim-snow.s1{top:-260px;height:calc(100% + 260px);animation-name:nsA!important}
.nim-snow.s2{top:-190px;height:calc(100% + 190px);animation-name:nsB!important}
.nim-snow.s3{top:-330px;height:calc(100% + 330px);animation-name:nsC!important;filter:none!important;opacity:.4}
@keyframes nsA{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,260px,0)}}
@keyframes nsB{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,190px,0)}}
@keyframes nsC{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,330px,0)}}
@media (max-width:900px){.nim-snow.s3{display:none!important}nav.side{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:#EEF6F8!important}body[data-theme=dark] nav.side{background:#0E1A1F!important}#tabbar,#mbar{background:rgba(250,253,254,.97)!important}body[data-theme=dark] #tabbar,body[data-theme=dark] #mbar{background:rgba(14,26,31,.97)!important}}
@media (prefers-reduced-motion:reduce){.btn,.icon-btn,nav.side .nav{transition:none}.nim-snow{animation:none!important}#nimQb{display:none!important}}

<script>
(function(){
 var d=new Date(),m=d.getMonth(),day=d.getDate();
 var winter=(m===10&&day>=20)||m===11||m<=1;            // 20 ноябрь – 28 феврал
 var qbSeason=(m===10&&day>=20)||m===11||(m===0&&day<=15); // Қорбобо: 20 ноябрь – 15 январ
 if(winter)document.body.classList.add('winter');
 document.addEventListener('pointermove',function(e){var b=e.target.closest&&e.target.closest('.btn,.icon-btn');if(!b)return;var r=b.getBoundingClientRect();b.style.setProperty('--mx',(e.clientX-r.left)+'px');b.style.setProperty('--my',(e.clientY-r.top)+'px');},{passive:true});
 document.addEventListener('pointerdown',function(e){var b=e.target.closest&&e.target.closest('.btn,.icon-btn');if(!b)return;var r=b.getBoundingClientRect();b.style.setProperty('--mx',(e.clientX-r.left)+'px');b.style.setProperty('--my',(e.clientY-r.top)+'px');},{passive:true});
 window.nimQorbobo=function(force){
  if(!qbSeason&&!force)return;
  var key='nim_qb_'+d.toISOString().slice(0,10);
  try{if(!force&&localStorage.getItem(key))return;localStorage.setItem(key,'1');}catch(e){}
  var q=document.getElementById('nimQb');if(!q)return;
  var bub=q.querySelector('.bub'),L=(function(){try{return localStorage.getItem('nim_lang')}catch(e){return ''}})();

  q.classList.remove('go');void q.offsetWidth;q.classList.add('go');
  setTimeout(function(){q.classList.remove('go')},9200);
 };
})();
</script>

baylanısadı hám birge biykar etiledi."],"Сақлангач, товар қолдиғи кўпаяди ва ўртача таннарх ўзи қайта ҳисобланади":["После сохранения остаток увеличится, средняя себестоимость пересчитается сама","Saqlanǵannan keyin tovar qaldıǵı kóbeyedi hám ortasha ózine túser baha ózi qayta esaplanadı"],"Қизил — қарзи ўтган ойга нисбатан ошган. Минус — мижоз олдиндан тўлаган.":["Красный — долг вырос по сравнению с прошлым месяцем. Минус — клиент заплатил заранее.","Qızıl — qarızı ótken ayǵa salıstırǵanda ósken. Minus — klient aldınnan tólegen."],"Кўп марта нотўғри парол киритилди. 15 дақиқадан кейин қайта уриниб кўринг":["Слишком много неверных паролей. Попробуйте через 15 минут","Kóp ret nadurıs parol kiritildi. 15 minuttan keyin qayta urınıp kóriń"],"Мижознинг телефони ёзилмаган. СМС учун мижоз карточкасига телефон қўшинг.":["У клиента нет телефона. Добавьте телефон в карточку клиента для СМС.","Klienttiń telefonı jazılmaǵan. SMS ushın klient kartochkasına telefon qosıń."],"Товар омбордан келган нархида чиқади ва шу ойнинг приход суммаси камаяди.":["Товар уходит по цене прихода, и сумма приходов этого месяца уменьшается.","Tovar skladtan kelgen bahasında shıǵadı hám usı aydıń prixod summası kemeyedi."],"Доставка йўқ. Сотув формасида «Доставка керак» белгиланса, шу ерда чиқади.":["Доставок нет. Если в форме продажи отмечено «Нужна доставка», они появятся здесь.","Jetkeriw yaq. Satıw formasında «Jetkeriw kerek» belgilense, usı jerde shıǵadı."],"Охирги қолдиқ мусбат — ходимга қарзмиз, манфий — ходим ортиқча олган (аванс).":["Остаток плюс — мы должны сотруднику, минус — сотрудник получил лишнее (аванс).","Aqırǵı qaldıq plyus — xızmetkerge qarızbız, minus — xızmetker artıqsha alǵan (avans)."],"Ҳамма товар етарли. (Товарга «минимал қолдиқ» ёзилса, шу ерда огоҳлантиради.)":["Всех товаров достаточно. (Если у товара задан «минимальный остаток», здесь будет предупреждение.)","Hámme tovar jeterli. (Tovarǵa «minimal qaldıq» jazılsa, usı jerde eskertedi.)"],"· Телефон · Сотувчи · Муддат (ихтиёрий). Минус сумма — мижоз олдиндан тўлаган.":["· Телефон · Продавец · Срок (необязательно). Минус — клиент заплатил заранее.","· Telefon · Satıwshı · Múddet (ıqtıyarlı). Minus summa — klient aldınnan tólegen."],"Тавсия: минимал қолдиқнинг 2 баробаригача тўлдириш. Миқдорни ўзгартирса бўлади.":["Совет: пополнять до 2× минимального остатка. Кол-во можно изменить.","Usınıs: minimal qaldıqtıń 2 ese kólemine shekem toltırıw. Muǵdardı ózgertiwge boladı."],"Товар ўз таннархида ўтади. Қабул қилувчи филиал «Қабул қилдим» босмагунча товар":["Товар переходит по своей себестоимости. Пока принимающий филиал не нажмёт «Я принял», товар","Tovar óz ózine túser bahasında ótedi. Qabıl etiwshi filial «Qabıl ettim» baspaǵansha tovar"],"Ҳар бир роль нима қила олишини ўзингиз белгилайсиз. Админ ҳамма нарсани қилади.":["Вы сами определяете, что может каждая роль. Админ может всё.","Hár bir rol ne isley alatuǵının ózińiz belgileysiz. Admin hámme nárseni isleydi."],"› белгили қаторни боссангиз, шу суммани ташкил қилган ҳужжатлар рўйхати очилади.":["Нажмите на строку с ›, чтобы открыть документы, из которых сложилась сумма.","› belgili qatardı bassańız, usı summanı quraǵan hújjetler dizimi ashıladı."],"Ҳамма сотувларнинг таннархи тўғри: кеч ёки орқа сана билан киритилган приход йўқ.":["Себестоимость всех продаж верна: нет приходов, внесённых поздно или задним числом.","Hámme satıwlardıń ózine túser bahası durıs: keshigip yamasa artqı sáne menen kiritilgen prixod yaq."],"Бу алмаштириш ҳужжати — таҳрирлаб бўлмайди, керак бўлса бекор қилиб қайта киритинг":["Это документ обмена — изменить нельзя, при необходимости отмените и внесите заново","Bul almastırıw hújjeti — ózgertip bolmaydı, kerek bolsa biykar etip qayta kiritiń"],"Масалан, сотувчи кун охирида пулни раҳбарга топширди ёки раҳбар кассадан пул олди.":["Например, продавец в конце дня сдал деньги руководителю или руководитель взял деньги из кассы.","Mısalı, satıwshı kún aqırında puldı basshıǵa tapsırdı yamasa basshı kassadan pul aldı."],"Тушумдан қайтаришлар айрилган. Ойлик (план ва фоизлар) «Ойлик» бўлимида ҳисобланади.":["Из выручки вычтены возвраты. Зарплата (план и проценты) считается в разделе «Зарплата».","Túsimnen qaytarıwlar alınǵan. Aylıq (joba hám procentler) «Aylıq» bóliminde esaplanadı."],"Долларда келган приходда шу курс автоматик қўйилади (приходда ўзгартириш ҳам мумкин).":["В приходе в долларах этот курс ставится автоматически (в приходе его можно изменить).","Dollarda kelgen prixodta usı kurs avtomat qoyıladı (prixodta ózgertiwge de boladı)."],"Ҳамма товар етарли. Товарга «минимал қолдиқ» ёзилган бўлса, камайганда шу ерда чиқади.":["Всех товаров достаточно. Если у товара задан «минимальный остаток», при снижении он появится здесь.","Hámme tovar jeterli. Tovarǵa «minimal qaldıq» jazılǵan bolsa, kemeygende usı jerde shıǵadı."],"Баланс мусбат — бизга қарз, манфий — биз қарзмиз. Доллардаги қарзлар жамига қўшилмаган.":["Баланс плюс — нам должны, минус — мы должны. Долларовые долги в итог не входят.","Balans plyus — bizge qarız, minus — biz qarızbız. Dollardaǵı qarızlar jámige qosılmaǵan."],"Номни приходда қандай ёзсангиз, шундай ёзинг. Қарз ва приходлар шу ном бўйича йиғилади.":["Пишите название так же, как в приходе. Долги и приходы собираются по этому названию.","Attı prixodta qalay jazsańız, solay jazıń. Qarız hám prixodlar usı at boyınsha jıynaladı."],"Бу икки филиалдан бирга сотув — таҳрирлаб бўлмайди, керак бўлса бекор қилиб қайта киритинг":["Это совместная продажа из двух филиалов — изменить нельзя, при необходимости отмените и внесите заново","Bul eki filialdan birge satıw — ózgertip bolmaydı, kerek bolsa biykar etip qayta kiritiń"],"Ойлик ва авансни «Ойлик» бўлимида беринг — бу ерга ёзсангиз, фойдадан икки марта айрилади.":["Выдавайте зарплату и аванс в разделе «Зарплата» — иначе прибыль уменьшится дважды.","Aylıq hám avanstı «Aylıq» bóliminde beriń — bul jerge jazsańız, paydadan eki ret alınadı."],"Биринчи марта кираётган бўлсангиз, ўзингизга янги парол ўйлаб топиб ёзинг (камида 6 белги).":["Если входите впервые — придумайте себе новый пароль (минимум 6 символов).","Birinshi ret kirip atırǵan bolsańız, ózińizge jańa parol oylap tabıń (keminde 6 belgi)."],"Имконингиз бўлганда тўлаб қўйишингизни сўраймиз. Саволингиз бўлса, бемалол қўнғироқ қилинг.":["Просим оплатить при возможности. Если есть вопросы — звоните.","Imkaniyatıńız bolǵanda tólep qoyıwıńızdı soraymız. Sorawıńız bolsa, erkin qońıraw etiń."],"Бошланғич қолдиқ: ёзилган миқдор ва таннарх тўғридан-тўғри қўйилади, фойда-зарарга тушмайди.":["Начальный остаток: введённые кол-во и себестоимость ставятся напрямую, в прибыль/убыток не идут.","Baslanǵısh qaldıq: jazılǵan muǵdar hám ózine túser baha tuwrıdan-tuwrı qoyıladı, payda-zıyanǵa túspeydi."],"Кассадаги пулни санаб, ҳақиқий суммани ёзинг. Фарқ бўлса, камомад ёки ортиқча бўлиб ёзилади.":["Пересчитайте деньги в кассе и введите фактическую сумму. Если есть разница — запишется недостача или излишек.","Kassadaǵı puldı sanap, haqıyqıy summanı jazıń. Ayırma bolsa, kemshilik yamasa artıqsha bolıp jazıladı."],"Қайтган товар омборга сотилган таннархида киради, фойда-зарар эса товар сотилган филиалдан (":["Возвращённый товар идёт на склад по себестоимости продажи, а прибыль/убыток — с филиала продажи (","Qaytqan tovar skladqa satılǵan ózine túser bahasında kiredi, payda-zıyan bolsa tovar satılǵan filialdan ("],"Келган товарни санаб, ҳақиқий миқдорни ёзинг. Кам келса, фарқи йўлдаги камомад бўлиб ёзилади.":["Пересчитайте пришедший товар и введите фактическое кол-во. Если меньше — разница запишется как недостача в пути.","Kelgen tovardı sanap, haqıyqıy muǵdardı jazıń. Kem kelse, ayırması joldaǵı kemshilik bolıp jazıladı."],"Пластик, Click ва перечисление орқали тушган ва тўланган пул. Банк кўчирмаси билан солиштириб туринг.":["Деньги, поступившие и оплаченные через пластик, Click и перечисление. Регулярно сверяйте с банковской выпиской.","Plastik, Click hám perechislenie arqalı túsken hám tólengen pul. Bank kóshirmesi menen salıstırıp turıń."],"Сотув ойлар бўйича, қайтаришлар айрилган, откатсиз. Охирги устун — шу ойни ўтган ой билан солиштириш.":["Продажи по месяцам, за вычетом возвратов, без отката. Последний столбец — сравнение с прошлым месяцем.","Satıw aylar boyınsha, qaytarıwlar alınǵan, otkatsız. Aqırǵı baǵana — usı aydı ótken ay menen salıstırıw."],"«Одатдагидан кўп» — шу ой охирги 3 ой ўртачасидан 30% дан ортиқ. Қаторни боссангиз, ҳужжатлари очилади.":["«Больше обычного» — в этом месяце более чем на 30% выше среднего за 3 мес. Нажмите на строку, чтобы открыть документы.","«Ádettegiden kóp» — usı ay aqırǵı 3 ay ortashasınan 30% dan artıq. Qatardı bassańız, hújjetleri ashıladı."],"Ўзгариш ходим кейинги марта янгилаганда ёки қайта кирганда ишлайди. Сервер ҳам шу рухсатларни текширади.":["Изменение заработает, когда сотрудник обновит страницу или войдёт заново. Сервер тоже проверяет эти права.","Ózgeris xızmetker keyingi ret jańalaǵanda yamasa qayta kirgende isleydi. Server de usı ruqsatlardı tekseredi."],"Сақлаганда ҳар филиал учун алоҳида сотув ёзилади ва улар бир-бирига боғланади. Мижоз қарзи битта бўлади.":["При сохранении для каждого филиала пишется отдельная продажа, и они связываются. Долг клиента будет один.","Saqlaǵanda hár filial ushın bólek satıw jazıladı hám olar bir-birine baylanısadı. Klient qarızı bireu boladı."],"Ҳозирча ҳам мижоз, ҳам таъминотчи бўлган фирма йўқ. Номлари ҳар хил ёзилган бўлса, юқорида қўлда танланг.":["Пока нет фирм, которые одновременно клиент и поставщик. Если названия записаны по-разному, выберите вручную выше.","Házirshe hám klient, hám jetkiziwshi bolǵan firma yaq. Atları hár qıylı jazılǵan bolsa, joqarıda qolda tańlań."],"iBox'да «Должники» → Excel'га юклаб олинг. Excel'дан устунларни нусхалаб, пастга қўйинг. Устунлар тартиби:":["В iBox «Должники» → скачайте в Excel. Скопируйте столбцы из Excel и вставьте ниже. Порядок столбцов:","iBox'ta «Dolzhniki» → Excel'ge júklep alıń. Excel'den baǵanalardı nusqalap, tómenge qoyıń. Baǵanalar tártibi:"],"Минус — пул чиқиб кетган (таннарх, харажат). Бошқа зарарлар: комиссия, курс фарқи, камомадлар, умидсиз қарз.":["Минус — деньги ушли (себестоимость, расходы). Прочие убытки: комиссия, курсовая разница, недостачи, безнадёжный долг.","Minus — pul shıǵıp ketken (ózine túser baha, qárejet). Basqa zıyanlar: komissiya, kurs ayırması, kemshilikler, úmitsiz qarız."],"Ҳар товарга «ҳақиқий нарх»ни ёзинг. Чекда эски нарх чиқади, фарқи откат бўлиб ёзилади ва мижозга кўринмайди.":["Укажите «фактическую цену» для каждого товара. В чеке будет старая цена, разница запишется как откат и клиенту не видна.","Hár tovarǵa «haqıyqıy baha»nı jazıń. Chekte eski baha shıǵadı, ayırması otkat bolıp jazıladı hám klientke kórinbeydi."],"Илтимос, қарзни 3 кун ичида тўланг ёки тўлов кунини биз билан келишинг. Акт-сверка керак бўлса, юбориб берамиз.":["Пожалуйста, оплатите долг в течение 3 дней или согласуйте с нами дату оплаты. Если нужен акт сверки — пришлём.","Ótinish, qarızdı 3 kún ishinde tóleń yamasa tólem kúnin biz benen kelisiń. Akt-sverka kerek bolsa, jiberip beremiz."],"iBox'да таъминотчилар (поставщиклар) қарзи ҳисоботини Excel'га юклаб олинг. Икки устунни нусхалаб, пастга қўйинг:":["В iBox скачайте отчёт по долгам поставщикам в Excel. Скопируйте два столбца и вставьте ниже:","iBox'ta jetkiziwshiler (postavshiklar) qarızı esabatın Excel'ge júklep alıń. Eki baǵananı nusqalap, tómenge qoyıń:"],"«Бериш мумкин» — мижоз пулини тўлиқ тўлаб бўлган сотувлар бўйича ҳисобланган откат. Бу бўлимни фақат админ кўради.":["«Можно выдать» — откат по продажам, полностью оплаченным клиентом. Этот раздел видит только админ.","«Beriwge boladı» — klient pulın tolıq tólep bolǵan satıwlar boyınsha esaplanǵan otkat. Bul bólimdi tek admin kóredi."],"Текшириб бўлгач «Кунни ёпиш»ни босинг — шу кун ва ундан олдинги кунлардаги ҳужжатларни ходимлар ўзгартира олмайди.":["После проверки нажмите «Закрыть день» — документы этого и предыдущих дней сотрудники изменить не смогут.","Tekserip bolǵannan keyin «Kúndi jabıw»dı basıń — usı kún hám onnan aldınǵı kúnlerdegi hújjetlerdi xızmetkerler ózgerte almaydı."],"Фарқ бор — демак қайсидир ҳаракат тизимга киритилмаган ёки кейинги санага киритилган. «Ой ҳаракатлари»ни текширинг.":["Есть разница — значит, какое-то движение не внесено или внесено более поздней датой. Проверьте «Движения за месяц».","Ayırma bar — demek qaysı bir háreket sistemaǵa kiritilmegen yamasa keyingi sánege kiritilgen. «Ay háreketleri»n tekseriń."],"Бўлаклар омбор қолдиғининг ичида ҳисобланади (алоҳида қўшилмайди) — бу рўйхат уларни унутмаслик ва аввал сотиш учун.":["Отрезки учитываются внутри складского остатка (не добавляются отдельно) — список, чтобы не забыть и продать первыми.","Bólekler sklad qaldıǵınıń ishinde esaplanadı (bólek qosılmaydı) — bul dizim olardı umıtpaw hám aldın satıw ushın."],"Пластик, Click ва перечисление орқали тушган пулдан банк ушлайдиган фоиз. Фойда-зарарда «Комиссия» бўлиб ўзи айрилади.":["Процент, который банк удерживает с денег через пластик, Click и перечисление. В прибыли/убытке вычитается как «Комиссия».","Plastik, Click hám perechislenie arqalı túsken puldan bank uslaytuǵın procent. Payda-zıyanda «Komissiya» bolıp ózi alınadı."],"Тизимда ким нимани қўшди, ўзгартирди ёки бекор қилди — ҳаммаси вақти билан ёзилади. Бу ёзувларни ҳеч ким ўчира олмайди.":["Кто что добавил, изменил или отменил в системе — всё записывается со временем. Эти записи никто не может удалить.","Sistemada kim neni qostı, ózgertti yamasa biykar etti — hámmesi waqtı menen jazıladı. Bul jazıwlardı hesh kim óshire almaydı."],"Қизил — пули тўлиқ тўланмаган сотувлар. Тўловлар энг эски қарздан бошлаб ёпилади. Қаторни боссангиз, нима олгани очилади.":["Красный — продажи, оплаченные не полностью. Оплаты закрывают сначала самый старый долг. Нажмите на строку, чтобы увидеть покупку.","Qızıl — pulı tolıq tólenbegen satıwlar. Tólemler eń eski qarızdan baslap jabıladı. Qatardı bassańız, ne alǵanı ashıladı."],"миқдорни ёзинг. Тизимдагидан фарқи камомад ёки ортиқча бўлиб алоҳида ҳужжатга ёзилади. Бўш қолган қаторлар ҳисобга олинмайди.":["введите кол-во. Разница с системой запишется отдельным документом как недостача или излишек. Пустые строки не учитываются.","muǵdardı jazıń. Sistemadaǵıdan ayırması kemshilik yamasa artıqsha bolıp bólek hújjetke jazıladı. Bos qatarlar esapqa alınbaydı."],", фойдадан олинган улуш. Шунинг учун фойда-зарарда соф фойдадан кейин алоҳида кўрсатилади. Бизнесга ўз пулини қўшса — «қўшди».":[", доля, взятая из прибыли. Поэтому в прибыли/убытке показывается отдельно после чистой прибыли. Если вкладывает свои деньги — «внёс».",", paydadan alınǵan úles. Sonıń ushın payda-zıyanda taza paydadan keyin bólek kórsetiledi. Biznesge óz pulın qossa — «qostı»."],"Профил труба: ён томонлари ва девори (мм), узунлиги (м). Лист: ўлчами (м) ва қалинлиги (мм). Уголок: томони ва қалинлиги (мм).":["Профильная труба: стороны и стенка (мм), длина (м). Лист: размер (м) и толщина (мм). Уголок: сторона и толщина (мм).","Profil truba: qaptalları hám diywalı (mm), uzınlıǵı (m). List: ólshemi (m) hám qalıńlıǵı (mm). Ugolok: tárepi hám qalıńlıǵı (mm)."],"«Ётибди» — охирги сотувдан (сотилмаган бўлса охирги киримдан) ўтган кун. «Қанчага етади» — охирги 90 кундаги сотув тезлиги билан.":["«Лежит» — дней с последней продажи (если не продавался — с последнего прихода). «На сколько хватит» — по скорости продаж за последние 90 дн.","«Jatır» — aqırǵı satıwdan (satılmaǵan bolsa aqırǵı kirimnen) ótken kún. «Qanshaǵa jetedi» — aqırǵı 90 kúndegi satıw tezligi menen."],"Пул — тизим бўйича ҳисобланган (касса санаш ва банк кўчирмаси билан солиштиринг). Доллар қарзи приход куни курсида. Бугунги курс:":["Деньги — рассчитаны по системе (сверяйте с пересчётом кассы и выпиской банка). Долларовый долг — по курсу дня прихода. Курс сегодня:","Pul — sistema boyınsha esaplanǵan (kassa sanaw hám bank kóshirmesi menen salıstırıń). Dollar qarızı prixod kúni kursında. Búgingi kurs:"],"Ҳар ой қанча харид қилгани (қайтаришлар айрилган). Тўқ яшил — кўп, бўш — шу ойда олмаган. «Тўхтаб қолган»ларга қўнғироқ қилиш керак.":["Сколько покупал каждый месяц (за вычетом возвратов). Тёмно-зелёный — много, пусто — в этом месяце не брал. «Остановившимся» нужно позвонить.","Hár ay qansha satıp alǵanı (qaytarıwlar alınǵan). Qoyıw jasıl — kóp, bos — usı ayda almaǵan. «Toqtap qalǵan»larǵa qońıraw etiw kerek."],"Нарх ва таннарх асосий ўлчов бирлигида (м, дона). Тушумдан откат айрилган. Товарни боссангиз, фақат ўшанинг шубҳали сотувлари қолади.":["Цена и себестоимость в основной ед. (м, шт). Из выручки вычтен откат. Нажмите на товар — останутся только его сомнительные продажи.","Baha hám ózine túser baha tiykarǵı ólshem birliginde (m, dana). Túsimnen otkat alınǵan. Tovardı bassańız, tek onıń gúmanlı satıwları qaladı."],"Янги ходим логини билан биринчи марта кирганда паролни ўзи ўйлаб топади. «Тиклаш» — ходим паролини унутса, кейинги киришда янгисини қўяди.":["Новый сотрудник при первом входе по логину сам придумывает пароль. «Восстановить» — если сотрудник забыл пароль, при следующем входе задаст новый.","Jańa xızmetker logini menen birinshi ret kirgende paroldı ózi oylap tabadı. «Tiklew» — xızmetker parolın umıtsa, keyingi kiriwde jańasın qoyadı."],"Қарз сотув санасидан неча кун ўтганига қараб бўлинган. Тўловлар энг эски қарзни биринчи ёпади. 90 кундан эски қарз — қайтмаслик хавфи юқори.":["Долг разбит по дням с даты продажи. Оплаты закрывают сначала самый старый долг. Долг старше 90 дн. — высокий риск невозврата.","Qarız satıw sánesinen neshe kún ótkenine qarap bólingen. Tólemler eń eski qarızdı birinshi jabadı. 90 kúnnen eski qarız — qaytpaw qáwpi joqarı."],"Бу охирги огоҳлантириш. Қарз тўланмагунча янги товар қарзга берилмайди. Илтимос, бугун-эрта ичида тўловни амалга оширинг ёки бизга қўнғироқ қилинг.":["Это последнее предупреждение. Пока долг не оплачен, новый товар в долг не выдаётся. Пожалуйста, оплатите в ближайшие дни или позвоните нам.","Bul aqırǵı eskertiw. Qarız tólenbegenshe jańa tovar qarızǵa berilmeydi. Ótinish, búgin-erteń ishinde tólemdi ámelge asırıń yamasa bizge qońıraw etiń."],"«Фойдага таъсири»: сотувда — ялпи фойда (откатсиз), харажатда — минус. Приход, тўлов, кўчириш фойдага таъсир қилмайди, фақат пул ва товар жойини ўзгартиради.":["«Влияние на прибыль»: в продаже — валовая прибыль (без отката), в расходе — минус. Приход, оплата, перемещение на прибыль не влияют, только меняют место денег и товара.","«Paydaǵa tásiri»: satıwda — jalpı payda (otkatsız), qárejette — minus. Prixod, tólem, kóshiriw paydaǵa tásir etpeydi, tek pul hám tovar ornın ózgertedi."],"Мижоз тўламайдиган бўлса (кетиб қолган, ёпилган ва ҳ.к.), қарзни шу ерда ёпасиз. Сумма фойда-зарарга «Умидсиз қарз» бўлиб зарар сифатида тушади. Касса ўзгармайди.":["Если клиент не будет платить (уехал, закрылся и т.п.), закройте долг здесь. Сумма пойдёт в прибыль/убыток как «Безнадёжный долг». Касса не меняется.","Klient tólemeytuǵın bolsa (ketip qalǵan, jabılǵan h.t.b.), qarızdı usı jerde jabasız. Summa payda-zıyanǵa «Úmitsiz qarız» bolıp zıyan sıpatında túsedi. Kassa ózgermeydi."],". Сўмдаги ва доллардаги қарзни алоҳида-алоҳида киритинг. Минус сумма — таъминотчига олдиндан тўлаганмиз. Бу ёзув фойда-зарарга, кассага ва омборга таъсир қилмайди.":[". Долги в сумах и долларах вносите отдельно. Минус — мы заплатили поставщику заранее. Эта запись не влияет на прибыль, кассу и склад.",". Sumdaǵı hám dollardaǵı qarızdı bólek-bólek kiritiń. Minus summa — jetkiziwshige aldınnan tólegenbiz. Bul jazıw payda-zıyanǵa, kassaǵa hám skladqa tásir etpeydi."],"Бир фирма ҳам мижоз, ҳам таъминотчи бўлса: биз ундан товар олдик (биз унга қарз), у биздан товар олди (у бизга қарз). Пул айланмасдан иккала қарз бир хил суммага ёпилади. Кассага ва банкка таъсир қилмайди.":["Если фирма и клиент, и поставщик: мы взяли у неё товар (мы должны), она взяла у нас товар (она должна). Оба долга закрываются на одинаковую сумму без движения денег. На кассу и банк не влияет.","Bir firma hám klient, hám jetkiziwshi bolsa: biz onnan tovar aldıq (biz oǵan qarız), ol bizden tovar aldı (ol bizge qarız). Pul aylanbastan eki qarız birdey summaǵa jabıladı. Kassaǵa hám bankke tásir etpeydi."],"Сервер ҳар кеча бутун базанинг нусхасини ўзи олади ва 14 кун сақлайди. Бундан ташқари ҳафтада бир марта шу тугмани босиб, файлни компьютерингизга ёки Google Drive'га сақлаб қўйинг. Файлда парол хешлари бор: бегонага берманг.":["Сервер каждую ночь сам делает копию всей базы и хранит её 14 дней. Кроме того, раз в неделю нажимайте эту кнопку и сохраняйте файл на компьютер или в Google Drive. В файле есть хеши паролей: не передавайте посторонним.","Server hár keshe pútkil bazanıń nusqasın ózi aladı hám 14 kún saqlaydı. Bunnan tısqarı háptesine bir ret usı túymeni basıp, fayldı kompyuterińizge yamasa Google Drive'ǵa saqlap qoyıń. Faylda parol xeshleri bar: biygana adamǵa bermeń."],"Сабаби: товар сотилгандан кейин унинг приходи орқа сана билан киритилган ёки приход кеч киритилган. Шунда сотилган пайтдаги таннарх нотўғри ҳисобланиб, фойда ёлғон чиқади. Тизим ҳамма ҳужжатни сана бўйича қайта ўйнатиб, тўғри таннархни топди.":["Причина: после продажи товара его приход внесён задним числом или с опозданием. Поэтому себестоимость на момент продажи посчитана неверно и прибыль ложная. Система переиграла все документы по дате и нашла верную себестоимость.","Sebebi: tovar satılǵannan keyin onıń prixodı artqı sáne menen yamasa keshigip kiritilgen. Sonda satılǵan waqıttaǵı ózine túser baha nadurıs esaplanıp, payda jalǵan shıǵadı. Sistema barlıq hújjetti sáne boyınsha qayta oynatıp, durıs ózine túser bahanı taptı."],"м, дона, кг":["м, шт, кг","m, dana, kg"],"масалан 1126":["например 1126","mısalı 1126"],"тушдан кейин":["после обеда","túsken soń"],"Масалан: Ҳамит":["Например: Хамит","Mısalı: Hamit"],"Арматура, Труба…":["Арматура, Труба…","Armatura, Truba…"],"масалан 10":["например 10","mısalı 10"],"Тугаш санаси":["Дата окончания","Tawsılıw sánesi"],"Бошланиш санаси":["Дата начала","Baslanıw sánesi"],"Қаторни ўчириш":["Удалить строку","Qatardı óshiriw"],"Бир марта олган":["Купил один раз","Bir ret alǵan"],"Ф function lineOtk(ln){ var r=pm(ln.real), p=pm(ln.price); if(!(r>0)) return '<span class="mut">бўш бўлса — откат йўқ</span>'; if(r>p) return '<span class="neg">чекдаги нархдан катта!</span>'; return 'Откат: <b>'+fmt(pq(ln.qty)*(p-r))+'</b>'; }

function dayChart(days){
  var p=S.month.split('-'), n=new Date(+p[0], +p[1], 0).getDate(), W=900, H=220, pl=56, pb=24, pt=10, bw=(W-pl-10)/n;

  if(!max) return '<div class="empty">Бу ойда ҳали сотув йўқ.</div>';
  var y=function(v){ return pt+(1-Math.max(0,v)/max)*(H-pt-pb); }, s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Кунлик сотув графиги">';
  for(var g=0; g<=3; g++){ var gv=max*g/3; s+='<line x1="'+pl+'" x2="'+(W-10)+'" y1="'+y(gv)+'" y2="'+y(gv)+'" stroke="var(--line)"></line><text x="'+(pl-6)+'" y="'+(y(gv)+4)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+short(gv)+'</text>'; }
  for(var d2=1; d2<=n; d2++){ var k=S.month+'-'+pad(d2), v=days[k], bx=pl+(d2-1)*bw;
    if(v && v.rev>0){ s+='<rect x="'+(bx+bw*.12)+'" y="'+y(v.rev)+'" width="'+(bw*.38)+'" height="'+(H-pb-y(v.rev))+'" rx="2" fill="var(--a1)"><title>'+dLabel(k)+': тушум '+fmt(v.rev)+'</title></rect>';

  rows.forEach(function(r){ var p=r.p, l=lp[p.code]||{}, u=unitOf(p), qv=O.q[p.code]!==undefined?O.q[p.code]:String(Math.ceil(conv(p,r.sug)*10)/10);

  setView(h+'</tbody></table></div><div class="pager"><span>Тавсия: минимал қолдиқнинг 2 баробаригача тўлдириш. Миқдорни ўзгартирса бўлади.</span></div></div>');

function drawClientList(debtOnly){
  var key=debtOnly?'debtors':'clients', st=jst(key);
  topActs((canMoney()?'<button class="btn" type="button" id="cPay">Тўлов қабул қилиш</button>':'')+(canSell()&&!debtOnly?'<button class="btn pri" type="button" id="cNew">+ Мижоз</button>':''), function(){

  setView(h);

    if(!list.length) t+='<tr><td colspan="6" class="empty">'+(debtOnly?(st.f.o?'Муддати ўтган қарз йўқ.':'Қарздор йўқ.'):'Мижоз йўқ. Сотувда мижоз номини ёзсангиз, ўзи қўшилади.')+'</td></tr>';
    list.forEach(function(c){ var lim=c.limit>0&&c.debt>c.limit;
      t+='<tr class="click" data-cid="'+esc(c.id)+'"><td class="c-main"><b>'+esc(c.name)+'</b>'+(c.note?'<div class="mut sm">'+esc(c.note)+'</div>':'')+(lim?' <span class="pill warn">лимитдан ошган</span>':'')+'</td><td class="c-x">'+(c.phone?esc(c.phone):'<span class="mut">—</span>')+'</td><td class="c-date">'+(c.last?dLabel(c.last):'—')+'</td><td class="n c-money '+(c.debt>0?'neg':(c.debt<0?'pos':'mut'))+'">'+(c.debt?fmt(c.debt):'0')+'</td>'+(debtOnly?'<td class="n c-tag">'+(c.over>0?'<b class="neg">'+fmt(c.over)+'</b><div class="sm neg">'+c.odays+' кун</div>':'<span class="mut">—</span>')+'</td>':'')+'<td class="n c-act">'+(debtOnly&&c.debt>0?'<button class="btn sm" type="button" data-rem="'+esc(c.id)+'">Эслатма</button> ':'')+(canMoney()&&c.debt>0?'<button class="btn sm" type="button" data-pay="'+esc(c.name)+'">Тўлов</button>':'')+'</td></tr>'; });

  if(x.plan>0){ var pr=Math.min(100,x.base/x.plan*100); h+='<div style="margin:10px 0"><div class="bar" style="height:10px"><i style="width:'+pr.toFixed(0)+'%;background:'+(pr>=100?'var(--pos)':'var(--a1)')+'"></i></div><div class="sm" style="margin-top:4px">План: '+fmt(x.plan)+' · '+(x.base>=x.plan?'<b class="pos">бажарилди ✓</b>'+(x.bonusAmt?' — бонус '+fmt(x.bonusAmt):''):'яна <b>'+fmt(x.plan-x.base)+'</b> қолди'+(x.bonusAmt?' (бонус '+fmt(x.bonusAmt)+')':''))+'</div></div>'; }
  if(x.tiers.length){ var nx=x.tiers[x.tier+1];
    h+='<h3 style="margin:14px 0 6px">Фоиз шкаласи'+(x.mode==='step'?' <span class="mut sm">(ҳар поғона ўз фоизи билан)</span>':' <span class="mut sm">(етган поғона фоизи бутун суммага)</span>')+'</h3><table><tbody>'+x.tiers.map(function(t,i){ var hi=x.tiers[i+1]; return '<tr'+(i===x.tier?' style="background:var(--act);font-weight:700"':'')+'><td>'+(t[0]?fM(t[0])+(hi?' — '+fM(hi[0]):' дан юқори'):(hi?fM(hi[0])+' гача':'ҳар қандай сумма'))+'</td><td class="n">'+String(t[1]).replace('.',',')+'%</td></tr>'; }).join('')+'</tbody></table>';
    if(nx) h+='<div class="sm" style="margin-top:6px">Яна <b>'+fmt(nx[0]-x.base)+'</b> пул тушса — <b>'+String(nx[1]).replace('.',',')+'%</b> бўлади.</div>'; }
  h+='<h3 style="margin:14px 0 6px">Тушган пул қаердан</h3><table><tbody><tr><td>Сотувда тўланган</td><td class="n">'+fmt(b.atSale)+'</td></tr><tr><td>Шу ой сотувларининг қарзидан йиғилди</td><td class="n">'+fmt(b.collSame)+'</td></tr><tr><td>Олдинги ойлар қарзидан йиғилди</td><td class="n">'+fmt(b.collOld)+'</td></tr>'+(b.refund?'<tr><td>Қайтаришда мижозга берилди</td><td class="n neg">−'+fmt(b.refund)+'</td></tr>':'')+(b.otkCut?'<tr><td class="mut">Откат ва доставка улуши (ҳисобга кирмайди)</td><td class="n mut">'+fmt(b.otkCut)+'</td></tr>':'')+'<tr class="sub"><td><b>Жами</b></td><td class="n"><b>'+fmt(x.base)+'</b></td></tr></tbody></table>';
  h+='<h3 style="margin:14px 0 6px">Ойлик</h3><table><tbody>'+(x.oklad?'<tr><td>Оклад</td><td class="n">'+fmt(x.oklad)+'</td></tr>':'')+(x.pctAmt?'<tr><td>Фоиздан ('+String(x.pct).replace('.',',')+'%)</td><td class="n">'+fmt(x.pctAmt)+'</td></tr>':'')+(x.planBonus?'<tr><td>План бонуси</td><td class="n pos">+'+fmt(x.planBonus)+'</td></tr>':'')+(x.extra?'<tr><td>Қўшимча бонус</td><td class="n pos">+'+fmt(x.extra)+'</td></tr>':'')+(x.fine?'<tr><td>Штраф</td><td class="n neg">−'+fmt(x.fine)+'</td></tr>':'')+'<tr class="sub"><td><b>Ҳисобланди</b></td><td class="n"><b>'+fmt(x.accrued)+'</b></td></tr>'+(x.adv?'<tr><td>Аванс берилди</td><td class="n">−'+fmt(x.adv)+'</td></tr>':'')+(x.paid?'<tr><td>Ойлик берилди</td><td class="n">−'+fmt(x.paid)+'</td></tr>':'')+'<tr class="tot"><td>Қолди</td><td class="n">'+fmt(x.left)+'</td></tr></tbody></table>';
  if(x.ops.length) h+='<h3 style="margin:14px 0 6px">Ҳаракатлар</h3><table><tbody>'+x.ops.map(function(o){ return '<tr><td>'+dLabel(o.date)+' · '+SOPK[o.kind]+(o.method?' <span class="mut sm">'+(METHODS[o.method]||'')+'</span>':'')+(o.note?'<div class="mut sm">'+esc(o.note)+'</div>':'')+'</td><td class="n '+(o.kind==='fine'?'neg':(o.kind==='bonus'?'pos':''))+'">'+fmt(o.amount)+(perm('salary_set')?' <button class="btn sm danger" type="button" data-sv="'+esc(o.id)+'">Бекор</button>':'')+'</td></tr>'; }).join('')+'</tbody></table>';
  return h;
}
function salDrawer(x){
  var adm=perm('salary_set');
  var h=drawerHead(esc(x.name), mLabel(S.month)+(x.pos?' · '+esc(x.pos):''))+(perm('salary_pay')?'<div class="dacts"><button class="btn sm pri" type="button" data-so="pay">Ойлик бериш</button><button class="btn sm" type="button" data-so="adv">Аванс</button>'+(adm?'<button class="btn sm" type="button" data-so="bonus">Бонус</button><button class="btn sm" type="button" data-so="fine">Штраф</button><button class="btn sm" type="button" id="slPl">'+(x.setup?'Шартни ўзгартириш':'Шарт қўйиш')+'</button>':'')+'</div>':'')+'<div class="db">'+(x.setup?'':'<div class="pill warn">Бу ходимга ойлик шарти (оклад, фоиз, план) ҳали қўйилмаган.</div>')+salBody(x)+'</div>';
  openDrawer(h, function(d){ d.querySelector('[data-close]').onclick=closeDrawer;
    if($('slPl')) $('slPl').onclick=function(){ planDrawer(x); };
    d.querySelectorAll('[data-so]').forEach(function(b){ b.onclick=function(){ salOpDrawer(x, b.dataset.so); }; });
    d.querySelectorAll('[data-sv]').forEach(function(b){ b.onclick=function(){ if(!armed(b)) return; b.disabled=true; api('voidSalOp', S.token, b.dataset.sv).then(function(){ toast('Бекор қилинди'); invalidate(); closeDrawer(); vSalary(); }).catch(function(e){ b.disabled=false; toast(errText(e),true); }); }; });
  });
}
function salOpDrawer(x, kind){
  var def=kind==='pay'?Math.max(0,x.left):0, pays=kind==='pay'||kind==='adv';
  var h=drawerHead(SOPK[kind]+' — '+esc(x.name), mLabel(S.month)+' учун')+'<div class="db"><div class="grid-f"><label class="f">Сумма<input class="inp money" id="soA" inputmode="numeric" value="'+(def?fmt(def):'')+'"></label><label class="f">Сана<input class="inp" type="date" id="soD" value="'+today()+'"></label>'+(pays?'<label class="f">Қаердан<select class="inp" id="soM">'+Object.keys(METHODS).filter(function(k){ return k!=='qarz'; }).map(function(k){ return '<option value="'+k+'">'+(k==='naqd'?'Нақд (кассадан)':METHODS[k])+'</option>'; }).join('')+'</select></label><label class="f">Филиал (касса)<select class="inp" id="soB">'+branchOpts(x.branch==='f2'?'f2':'f1',['f1','f2'])+'</select></label>':'')+'<label class="f" style="grid-column:1/-1">Изоҳ<input class="inp" id="soN" placeholder="'+(kind==='fine'?'Сабаби':'')+'"></label></div><button class="btn pri" type="button" id="soS" style="height:44px">Сақлаш</button></div>';
  openDrawer(h, function(d){ d.querySelector('[data-close]').onclick=function(){ salDrawer(x); }; $('soA').oninput=function(){ var v=pm(this.value); this.value=this.value.trim()?fmt(v):''; }; $('soA').focus();
    $('soS').onclick=function(){ var b=this; busy(b,true); api('addSalOp', S.token, {staff:x.name, month:S.month, kind:kind, amount:pm($('soA').value), date:$('soD').value, method:$('soM')?$('soM').value:'', branch:$('soB')?$('soB').value:(x.branch==='f2'?'f2':'f1'), note:$('soN').value}).then(function(){ toast('Сақланди'); invalidate(); closeDrawer(); vSalary(); }).catch(function(e){ busy(b,false); toast(errText(e),true); }); }; });
}
function planDrawer(x){
  var T=x.tiers.length?x.tiers.map(function(t){ return t.slice(); }):[[0,0.8],[800000000,1]], mode=x.mode||'all';
  var draw=function(){
    var h=drawerHead('Ойлик шарти — '+esc(x.name), 'Танланган ойдан бошлаб амал қилади, кейинги ойларга ҳам ўтади')+'<div class="db"><div class="grid-f"><label class="f">Қайси ойдан<input class="inp" type="month" id="plM" value="'+S.month+'"></label><label class="f">Оклад (ҳар ой)<input class="inp money" id="plO" inputmode="numeric" value="'+(x.oklad?fmt(x.oklad):'')+'"></label><label class="f">План (тушган пул)<input class="inp money" id="plP" inputmode="numeric" value="'+(x.plan?fmt(x.plan):'')+'"></label><label class="f">План бажарилса бонус<input class="inp money" id="plB" inputmode="numeric" value="'+(x.bonusAmt?fmt(x.bonusAmt):'')+'"></label></div>';
    h+='<h3 style="margin:8px 0 4px">Фоиз шкаласи</h3><div class="mut sm">Сотувчи бўлмаса (омборчи, юкчи), шкалани бўш қолдиринг — фақат оклад.</div><table><thead><tr><th>Тушган пул шундан бошлаб</th><th class="n">Фоиз</th><th></th></tr></thead><tbody>'+T.map(function(t,i){ return '<tr><td><input class="inp money" data-tf="'+i+'" inputmode="numeric" value="'+fmt(t[0])+'"></td><td class="n"><input class="inp qty" data-tp="'+i+'" inputmode="decimal" value="'+String(t[1]).replace('.',',')+'" style="width:80px"> %</td><td><button class="btn sm" type="button" data-td="'+i+'">×</button></td></tr>'; }).join('')+'</tbody></table><button class="btn sm" type="button" id="plAdd">+ Поғона қўшиш</button>';
    h+='<label class="f" style="margin-top:10px">Қандай ҳисобланади<select class="inp" id="plMd"><option value="all"'+(mode==='all'?' selected':'')+'>Етган поғона фоизи бутун суммага (масалан, 900 млн × 1%)</option><option value="step"'+(mode==='step'?' selected':'')+'>Ҳар поғона ўз фоизи билан (800 млн × 0,8% + 100 млн × 1%)</option></select></label>';
    h+='<button class="btn pri" type="button" id="plS" style="height:44px;margin-top:12px">Сақлаш</button></div>';
    openDrawer(h, function(d){ d.querySelector('[data-close]').onclick=function(){ salDrawer(x); };
      d.querySelectorAll('.money').forEach(function(i){ i.oninput=function(){ var v=pm(this.value); this.value=this.value.trim()?fmt(v):''; if(this.dataset.tf) T[+this.dataset.tf][0]=v; }; });
      d.querySelectorAll('[data-tp]').forEach(function(i){ i.oninput=function(){ T[+i.dataset.tp][1]=parseFloat(String(i.value).replace(',','.'))||0; }; });
      d.querySelectorAll('[data-td]').forEach(function(b){ b.onclick=function(){ T.splice(+b.dataset.td,1); keep(); draw(); }; });
      $('plMd').onchange=function(){ mode=this.value; };
      var keep=function(){ x={name:x.name,pos:x.pos,branch:x.branch,tiers:T,mode:mode,oklad:pm($('plO').value),plan:pm($('plP').value),bonusAmt:pm($('plB').value),b:x.b,base:x.base,ops:x.ops,setup:x.setup,accrued:x.accrued,left:x.left,adv:x.adv,paid:x.paid,fine:x.fine,extra:x.extra,pct:x.pct,pctAmt:x.pctAmt,planBonus:x.planBonus,tier:x.tier}; };
      $('plAdd').onclick=function(){ keep(); var l=T[T.length-1]; T.push([l?l[0]+100000000:0, l?Math.round((l[1]+0.1)*10)/10:1]); draw(); };
      $('plS').onclick=function(){ var b=this; busy(b,true); api('savePlan', S.token, {staff:x.name, month:$('plM').value, oklad:pm($('plO').value), plan:pm($('plP').value), bonus:pm($('plB').value), tiers:T, mode:$('plMd').value}).then(function(){ toast('Шарт сақланди'); invalidate(); closeDrawer(); vSalary(); }).catch(function(e){ busy(b,false); toast(errText(e),true); }); };
    });
  };
  draw();
}
function staffDrawer(ed){
  var L=(S.sal&&S.sal.staff)||[], names={}; S.users.forEach(function(u){ names[u]=1; }); L.forEach(function(x){ delete names[x.name]; });
  var e=ed||{};
  var h=drawerHead('Ходимлар','Сотувчининг исми тизимдаги логин исми билан бир хил бўлиши керак')+'<div class="db"><table><tbody>'+(L.length?L.map(function(x,i){ return '<tr class="click" data-se="'+i+'"><td><b>'+esc(x.name)+'</b>'+(x.active==='no'?' <span class="pill">ишламайди</span>':'')+'<div class="mut sm">'+esc(x.pos||'')+' · '+(BR[x.branch]||'Иккала филиал')+'</div></td><td class="n mut sm">ўзгартириш ›</td></tr>'; }).join(''):'<tr><td class="empty">Ҳали ходим йўқ.</td></tr>')+'</tbody></table>';
  h+='<h3 style="margin:14px 0 6px">'+(e.id?'Ўзгартириш':'Янги ходим')+'</h3><div class="grid-f"><label class="f">Исм<input class="inp" id="sfN" list="sfL" value="'+esc(e.name||'')+'"'+(e.id?' readonly':'')+'><datalist id="sfL">'+Object.keys(names).map(function(n){ return '<option value="'+esc(n)+'">'; }).join('')+'</datalist></label><label class="f">Лавозим<input class="inp" id="sfP" list="sfPL" value="'+esc(e.pos||'')+'" placeholder="Сотувчи, омборчи, юкчи…"><datalist id="sfPL"><option value="Сотувчи"><option value="Омборчи"><option value="Юкчи"><option value="Ҳайдовчи"><option value="Бухгалтер"></datalist></label><label class="f">Филиал<select class="inp" id="sfB">'+['f1','f2','all'].map(function(b){ return '<option value="'+b+'"'+(e.branch===b?' selected':'')+'>'+(BR[b]||'Иккала филиал')+'</option>'; }).join('')+'</select></label><label class="f">Ҳолати<select class="inp" id="sfA"><option value="yes">Ишлаяпти</option><option value="no"'+(e.active==='no'?' selected':'')+'>Ишдан кетган</option></select></label></div><button class="btn pri" type="button" id="sfS" style="height:44px">Сақлаш</button></div>';
  openDrawer(h, function(d){ d.querySelector('[data-close]').onclick=closeDrawer;
    d.querySelectorAll('[data-se]').forEach(function(tr){ tr.onclick=function(){ staffDrawer(L[+tr.dataset.se]); }; });
    $('sfS').onclick=function(){ var b=this; busy(b,true); api('saveStaff', S.token, {id:e.id, name:$('sfN').value, pos:$('sfP').value, branch:$('sfB').value, active:$('sfA').value}).then(function(){ toast('Сақланди'); invalidate(); return api('salary', S.token, S.month); }).then(function(r){ S.sal=r; staffDrawer(); vSalary(); }).catch(function(e2){ busy(b,false); toast(errText(e2),true); }); }; });
}
function usersBox(){

    var bo=function(sel){ return [['all','Иккала филиал'],['f1','1-филиал'],['f2','2-филиал']].map(function(b){ return '<option value="'+b[0]+'"'+(b[0]===sel?' selected':'')+'>'+b[1]+'</option>'; }).join(''); };
    var h='<div class="card flush"><div class="toolbar"><b>Ходимлар ва роллар</b><span style="flex:1"></span><button class="btn sm pri" type="button" id="uAdd">+ Ходим қўшиш</button></div><div class="tbl"><table class="jt cards"><thead><tr><th>Исм</th><th>Логин</th><th>Роль</th><th>Филиал</th><th>Парол</th><th></th></tr></thead><tbody>'+L.map(function(u,i){ return '<tr data-ui="'+i+'"><td class="c-main"><input class="inp" data-f="name" value="'+esc(u.name)+'" style="width:170px"></td><td class="c-date mut">'+esc(u.login)+'</td><td class="c-tag"><select class="inp" data-f="role">'+ro(u.role)+'</select></td><td class="c-tag"><select class="inp" data-f="branch">'+bo(u.branch)+'</select></td><td class="c-tag">'+(u.hasPass?'<span class="pill ok">қўйилган</span> <button class="btn sm" type="button" data-rp="'+esc(u.login)+'">Тиклаш</button>':'<span class="pill warn">биринчи киришда қўяди</span>')+'</td><td class="c-act"><button class="btn sm" type="button" data-us="'+i+'">Сақлаш</button></td></tr>'; }).join('')+'</tbody></table></div><div class="pager"><span>Янги ходим логини билан биринчи марта кирганда паролни ўзи ўйлаб топади. «Тиклаш» — ходим паролини унутса, кейинги киришда янгисини қўяди.</span></div></div>';
    el.innerHTML=h;

    el.querySelectorAll('[data-rp]').forEach(function(b){ b.onclick=function(){ if(!armed(b)) return; api('resetPassword', S.token, b.dataset.rp).then(function(){ toast('Парол тикланди: ходим кейинги киришда янги парол қўяди'); usersBox(); }).catch(function(e){ toast(errText(e),true); }); }; });
    $('uAdd').onclick=function(){ var h2=drawerHead('Янги ходим','')+'<div class="db"><div class="grid-f"><label class="f">Исм<input class="inp" id="nuN" placeholder="Муса"></label><label class="f">Логин (лотинча)<input class="inp" id="nuL" placeholder="musa" autocapitalize="off"></label><label class="f">Роль<select class="inp" id="nuR">'+ro('editor')+'</select></label><label class="f">Филиал<select class="inp" id="nuB">'+bo('f1')+'</select></label></div><div class="mut sm">Ходим шу логин билан биринчи марта кирганда паролни ўзи қўяди.</div><button class="btn pri" type="button" id="nuS" style="height:44px">Қўшиш</button></div>';
      openDrawer(h2, function(d){ d.querySelector('[data-close]').onclick=closeDrawer; $('nuS').onclick=function(){ var b=this; busy(b,true); api('saveUser', S.token, {login:$('nuL').value, name:$('nuN').value, role:$('nuR').value, branch:$('nuB').value}).then(function(){ toast('Ходим қўшилди'); closeDrawer(); return refreshBoot(); }).then(usersBox).catch(function(e){ busy(b,false); toast(errText(e),true); }); }; }); };
  }).catch(function(e){ if($('usrBox')) $('usrBox').innerHTML='<div class="card neg">'+esc(errText(e))+'</div>'; });
}
function permBox(){
  api('permsGet', S.token).then(function(G){ var el=$('permBox'); if(!el) return; var P=JSON.parse(JSON.stringify(G.perms)), grp='';
    var h='<div class="card flush"><div class="toolbar"><b>Рухсатлар</b><span class="mut sm">Ҳар бир роль нима қила олишини ўзингиз белгилайсиз. Админ ҳамма нарсани қилади.</span><span style="flex:1"></span><button class="btn sm" type="button" id="pmDef">Бошланғичга қайтариш</button><button class="btn sm pri" type="button" id="pmSave">Сақлаш</button></div><div class="tbl"><table class="jt perm"><thead><tr><th>Рухсат</th>'+G.roles.map(function(r){ return '<th style="text-align:center">'+ROLES[r]+'</th>'; }).join('')+'</tr></thead><tbody>';
    G.keys.forEach(function(k){ if(k[1]!==grp){ grp=k[1]; h+='<tr class="sub"><td colspan="'+(G.roles.length+1)+'">'+grp+'</td></tr>'; }
      h+='<tr><td>'+k[2]+'</td>'+G.roles.map(function(r){ return '<td style="text-align:center"><input type="checkbox" data-pr="'+r+'" data-pk="'+k[0]+'"'+(P[r].indexOf(k[0])>=0?' checked':'')+'></td>'; }).join('')+'</tr>'; });
    h+='</tbody></table></div><div class="pager"><span>Ўзгариш ходим кейинги марта янгилаганда ёки қайта кирганда ишлайди. Сервер ҳам шу рухсатларни текширади.</span></div></div>';
    el.innerHTML=h;
    el.querySelectorAll('[data-pr]').forEach(function(c){ c.onchange=function(){ var a=P[c.dataset.pr], k=c.dataset.pk; if(c.checked){ if(a.indexOf(k)<0) a.push(k); } else P[c.dataset.pr]=a.filter(function(x){ return x!==k; }); }; });
    $('pmSave').onclick=function(){ var b=this; busy(b,true); api('permsSet', S.token, P).then(function(){ busy(b,false); toast('Рухсатлар сақланди'); }).catch(function(e){ busy(b,false); toast(errText(e),true); }); };
    $('pmDef').onclick=function(){ if(!armed(this)) return; api('permsSet', S.token, G.def).then(function(){ toast('Бошланғич рухсатлар қайтарилди'); permBox(); }).catch(function(e){ toast(errText(e),true); }); };

  $('negSel').onchange=function(){ var v=this.value; api('setNegPolicy', S.token, v).then(function(){ S.neg=v; toast('Сақланди'); }).catch(function(e){ toast(errText(e),true); }); };
  $('usdIn').oninput=function(){ var v=pm(this.value); this.value=this.value.trim()?fmt(v):''; };
  $('usdSave').onclick=function(){ var b=this; busy(b,true); api('setUsdRate', S.token, pm($('usdIn').value)).then(function(r){ S.usd=r; busy(b,false); toast('Курс сақланди: '+fmt(r)); }).catch(function(e){ busy(b,false); toast(errText(e),true); }); };
}

/* ---------- login & start ---------- */
function toLogin(msg){ S.token=null; try{ localStorage.removeItem('nim_token'); }catch(_){} closeDrawer(); $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('lErr').textContent=msg||''; $('lPass').value=''; }
function start(){
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  setTimeout(function(){ if(window.nimQorbobo) nimQorbobo(); },1400);
  setView('<div class="card empty">Юкланмоқда…</div>');
  refreshBoot().then(function(){
    $('uName').textContent=S.me.name; $('ava').textContent=(S.me.name||'?').charAt(0).toUpperCase();
    $('uRole').textContent=(ROLES[S.me.role]||S.me.role)+(S.me.branch&&S.me.branch!=='all'?' · '+BR[S.me.branch]:'');
    if(S.me.role!=='admin' && S.me.role!=='viewer' && S.me.branch && S.me.branch!=='all'){ S.branch=S.me.branch; $('branchSel').value=S.branch; $('branchSel').disabled=true; }
    go(S.view||'home');
  }).catch(function(e){ if(!/SESSION/.test(String(e&&e.message||e))) failView(e); });
}
$('loginForm').addEventListener('submit', function(ev){ ev.preventDefault(); $('lErr').textContent=''; var b=$('lBtn'); b.disabled=true; b.textContent='Текширилмоқда…';
  call('login', $('lLogin').value, $('lPass').value).then(function(r){ S.token=r.token; try{ localStorage.setItem('nim_token', r.token); }catch(_){} $('lPass').value=''; start(); })
  .catch(function(e){ $('lErr').textContent=errText(e); }).then(function(){ b.disabled=false; b.textContent='Кириш'; }); });
$('logoutBtn').onclick=function(){ var t=S.token; toLogin(''); call('logout', t).catch(function(){}); };
$('navList').onclick=function(e){
  var g=e.target.closest('[data-g]'); if(g){ S.open[g.dataset.g]=!S.open[g.dataset.g]; renderNav(); return; }
  var b=e.target.closest('[data-v]'); if(b) go(b.dataset.v);
};
$('branchSel').onchange=function(){ S.branch=this.value; closeDrawer(); render(); };
$('refreshBtn').onclick=function(){ invalidate(); refreshBoot().then(render).then(function(){ toast('Янгиланди'); }).catch(function(e){ toast(errText(e),true); }); };
$('themeBtn').onclick=function(){ var d=document.body.dataset.theme==='dark'?'':'dark'; document.body.dataset.theme=d; try{ localStorage.setItem('nim_theme', d); }catch(_){} };
$('menuBtn').onclick=function(){ document.body.classList.toggle('mnav'); };
$('scrim').onclick=function(){ closeDrawer(); document.body.classList.remove('mnav'); };
document.addEventListener('keydown', function(e){ if(e.key==='Escape' && document.body.classList.contains('dr')) closeDrawer(); });
(function init(){
  S.month=thisMonth();
  try{ var th=localStorage.getItem('nim_theme'); if(th) document.body.dataset.theme=th; }catch(_){}
  var t=null; try{ t=localStorage.getItem('nim_token'); }catch(_){}
  if(!t){ $('lLogin').focus(); return; }
  call('me', t).then(function(){ S.token=t; start(); }).catch(function(){ toLogin(''); });
})();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
